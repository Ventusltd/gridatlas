name: Satellite survey published proof
on:
  push:
    branches: ['test/satellite-survey-202609111007']
    paths: ['.github/workflows/satellite-survey-202609111007.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ece848117a6d21b7fccb232557194877698c48a9
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /STATE.md
            /index.html
            /.github/**
            /tools/scope/**
            /scope-of-works/**
            /atlas/index.html
            /atlas/current.json
            /atlas/releases/*/index.html
            /atlas/releases/202608300453-atlas-v9/**
            /atlas/releases/cartridges/**
            /atlas/cartridges/202609041945-streaming-parquet-bridge-v9-5.js
            /atlas/cartridges/202609071213-place-global-search-v9-5.js
            /atlas/cartridges/202609062358-substation-intelligence-v9-63.js
            /atlas/cartridges/202609080850-sld-sandbox-v9-8.js
            /atlas/testcode/202609111007/**
            /releases/current-v5.json
            /state/live-set.json
      - name: Verify publication scope and deterministic state
        run: |
          mkdir -p evidence
          git status --short --branch
          git diff --name-status HEAD~1 HEAD | tee evidence/changed-paths.txt
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--name-only','HEAD~1','HEAD'],text=True).splitlines()
          assert len(names)==7 and all(n.startswith('atlas/testcode/202609111007/') for n in names), names
          PY
          node --check atlas/testcode/202609111007/satellite.js
          node tools/scope/loop.mjs lint > evidence/scope-lint.log 2>&1
          node tools/scope/loop.mjs state --stdout > evidence/state-check.md 2> evidence/state-error.log
          cmp STATE.md evidence/state-check.md
          git diff --exit-code -- STATE.md atlas/current.json atlas/index.html index.html
      - name: Verify exact served bytes
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          root='https://ventusltd.github.io/gridatlas/atlas/testcode/202609111007/'
          results={}
          for name in ['index.html','satellite.js','manifest.json']:
              local=Path('atlas/testcode/202609111007',name).read_bytes()
              deadline=time.monotonic()+90
              while True:
                  try:
                      with urllib.request.urlopen(root+name+'?verify=ece8481',timeout=15) as r: remote=r.read()
                      if remote==local: break
                  except Exception: pass
                  if time.monotonic()>deadline: raise RuntimeError('Served bytes mismatch: '+name)
                  time.sleep(5)
              results[name]={'match':True,'sha256':hashlib.sha256(local).hexdigest()}
          Path('evidence/served-byte-verification.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results))
          PY
      - name: Install browser driver
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Actual published browser URL without interception
        env:
          LIVE_TEST: '1'
        run: python atlas/testcode/202609111007/browser-proof.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: satellite-survey-published-evidence
          path: evidence/
          retention-days: 7

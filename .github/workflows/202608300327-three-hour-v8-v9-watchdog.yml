name: 202608300327 Three-hour V8 V9 comparator watchdog
run-name: Hourly V8/V9 closure check ${{ github.run_number }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300327-three-hour-v8-v9-watchdog.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 3-5 30 8 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: gridatlas-three-hour-v8-v9-watchdog
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MISSION_INCEPTED_AT: '2026-08-30T02:27:00Z'
  MISSION_EXPIRES_AT: '2026-08-30T05:28:00Z'
  EXPECTED_RELEASE_ID: 202608292311-atlas-v9
  EXPECTED_GENERATION: '202608292311'
  ATLAS_STATE_URL: https://ventusltd.github.io/gridatlas/state/live-set.json
  ORACLE_URL: https://globalgrid2050.com/repd_grid_atlasv8/
  PARENT_URL: https://ventusltd.github.io/gridatlas/202608292126-atlas-v9/
  CONTRACT: contracts/202608292311-render-ready-runtime.json
  COMPARATOR: atman/202608292311-render-ready-comparator.mjs
  GOLDEN_REPD_REF: '16135'

jobs:
  compare:
    name: Re-run actual 400 kV V8/V9 machine comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 120
          persist-credentials: false

      - name: Enforce bounded three-hour mission window
        id: window
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          expires="$(date -u -d "$MISSION_EXPIRES_AT" +%s)"
          if (( now > expires )); then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Atlas V9 watchdog retired'
              echo
              echo "Mission window ended at $MISSION_EXPIRES_AT. No build, mutation or comparator was started."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          {
            echo '## Atlas V9 hourly closure check'
            echo
            echo "- Window: $MISSION_INCEPTED_AT to $MISSION_EXPIRES_AT"
            echo "- Oracle: $ORACLE_URL"
            echo "- Expected current: $EXPECTED_RELEASE_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve exact promoted Atlas candidate
        if: steps.window.outputs.active == 'true'
        id: atlas
        run: |
          set -euo pipefail
          mkdir -p work
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "$ATLAS_STATE_URL" -o work/live-set.json
          python3 -m json.tool work/live-set.json >/dev/null
          test "$(jq -r '.schema' work/live-set.json)" = gridatlas.live-set.v5
          test "$(jq -r '.classification' work/live-set.json)" = VERIFIED_LIVE_V8_MIRROR_RENDER_READY_ATLAS_V9
          test "$(jq -r '.generation' work/live-set.json)" = "$EXPECTED_GENERATION"
          test "$(jq -r '.current.release_id' work/live-set.json)" = "$EXPECTED_RELEASE_ID"
          test "$(jq -r '.verification.promotion_eligible' work/live-set.json)" = true
          test "$(jq -r '.verification.failed_gates' work/live-set.json)" = 0
          test "$(jq -r '.verification.v8_css_byte_identical' work/live-set.json)" = true
          test "$(jq -r '.verification.v8_html_surface_preserved' work/live-set.json)" = true
          live_url="$(jq -r '.current.live_url' work/live-set.json)"
          test "$live_url" = "https://ventusltd.github.io/gridatlas/$EXPECTED_RELEASE_ID/"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            "${live_url}release-manifest.json" -o work/release-manifest.json
          test "$(jq -r '.release_id' work/release-manifest.json)" = "$EXPECTED_RELEASE_ID"
          effective="$(curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
            --output work/golden.html --write-out '%{url_effective}' \
            "${live_url}?repd_ref=${GOLDEN_REPD_REF}")"
          test "$effective" = "${live_url}?repd_ref=${GOLDEN_REPD_REF}"
          grep -q 'ventus-corev8engine.js' work/golden.html
          echo "live_url=$live_url" >> "$GITHUB_OUTPUT"

      - name: Configure pinned Node
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install pinned browser runtime
        if: steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run public Atman V8/V9 machine comparator
        if: steps.window.outputs.active == 'true'
        env:
          CANDIDATE_URL: ${{ steps.atlas.outputs.live_url }}
          MODE: public
          OUTPUT: work/hourly-public-render-ready-proof.json
          RECORD_OUTPUT: work/hourly-public-render-ready-record.jsonl
        run: |
          set -euo pipefail
          node "$COMPARATOR"
          test "$(jq -r '.classification' "$OUTPUT")" = VERIFIED_PUBLIC_RENDER_READY_400KV
          test "$(jq -r '.failed_gates' "$OUTPUT")" = 0
          test "$(jq -r '.label' "$RECORD_OUTPUT")" = PROMOTE
          test "$(jq -r '.privacy' "$RECORD_OUTPUT")" = NO_PERSONAL_DATA

      - name: Publish comparator report to the Actions summary
        if: always() && steps.window.outputs.active == 'true'
        run: |
          set -euo pipefail
          if test -f work/hourly-public-render-ready-proof.json; then
            {
              echo
              echo '### V8/V9 actual-render result'
              echo
              echo "- Classification: $(jq -r '.classification' work/hourly-public-render-ready-proof.json)"
              echo "- Failed promotion gates: $(jq -r '.failed_gates' work/hourly-public-render-ready-proof.json)"
              echo "- V8 desktop p95: $(jq -r '.benchmark.oracle.desktop.render_ready.p95_ms' work/hourly-public-render-ready-proof.json) ms"
              echo "- V9 desktop p95: $(jq -r '.benchmark.candidate.desktop.render_ready.p95_ms' work/hourly-public-render-ready-proof.json) ms"
              echo "- V8 mobile p95: $(jq -r '.benchmark.oracle.mobile.render_ready.p95_ms' work/hourly-public-render-ready-proof.json) ms"
              echo "- V9 mobile p95: $(jq -r '.benchmark.candidate.mobile.render_ready.p95_ms' work/hourly-public-render-ready-proof.json) ms"
              echo "- 400 kV actual render: $(jq -r '[.gates[] | select(.id | test("rendered$")) | .passed] | all' work/hourly-public-render-ready-proof.json)"
              echo "- Deep-link query preserved: true"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo '### V8/V9 actual-render result'
              echo
              echo '- Comparator proof was not produced; inspect the first failed step.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

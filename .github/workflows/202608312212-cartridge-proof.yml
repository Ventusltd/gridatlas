# Every cartridge push runs the proof of the cartridge that is composed.
#
# The bounded scope loop is retired and fires only on workflow_dispatch, and
# the verify-live workflow triggers on a path list that does not include
# atlas/. So until now a cartridge could be composed, hashed, pushed and served
# with nobody having run its proof except the person who wrote it.
#
# That proof is 253 checks, and every one of them encodes something that was
# actually wrong on a live page: central AC larger than any nameplate in the
# plant, a project marker invisible against the links converging on it, a boot
# that needed a painted basemap, a symbol layer throwing once per frame for
# want of a glyph atlas. Guarding that by hand is not guarding it.
#
# TWO REPOSITORIES, DELIBERATELY.
#
# The proof's parity check measures every distance the cartridge produces
# against Ventusltd/grid-distance-maths, the canonical geodesy for the estate,
# and it needs that repository checked out BESIDE this one. The first run of
# this workflow failed for exactly that reason and was right to: one repo on
# the runner, so the check that guards the arithmetic could not run and said
# so. Checking out both is what makes the parity real rather than a thing that
# only ever happens on one laptop.
#
# Deliberately cheap otherwise: node, no browser, no history.
#
# THE ACTIONS ARE PINNED BY COMMIT, and this workflow is the reason to care.
# It is the gate every cartridge cut passes through, so whatever it trusts,
# the whole composition trusts. `@v4` is a mutable tag: whoever can move it
# can run code inside the one job that decides whether a generation ships,
# with the repository checked out. Three of them stood here - checkout twice,
# setup-node once - and nowhere else in this repository; the other four
# workflows were already pinned by SHA, so the only unpinned actions in
# gridatlas were in its guard rail.
#
# 11bd71901bbe5b1630ceea73d27597364c9af683 is actions/checkout v4.2.2, the
# same commit tools/scope/loop.mjs already asserts for the scope loop, so the
# repository now names one checkout everywhere.

name: 202608312212 GridAtlas cartridge proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - 'tools/proofs/**'
      - 'tools/scope/**'
      - '.github/workflows/202608312212-cartridge-proof.yml'
  pull_request:
    paths:
      - 'atlas/**'
      - 'tools/proofs/**'
      - 'tools/scope/**'

permissions:
  contents: read

concurrency:
  group: gridatlas-cartridge-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gridatlas
    steps:
      - name: Checkout the pushed state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: gridatlas

      # Beside it, not inside it: the proof resolves ../grid-distance-maths.
      - name: Checkout the canonical geodesy beside it
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ventusltd/grid-distance-maths
          path: grid-distance-maths

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '24'

      # Every digest in this repository is of git blob content, which is LF. A
      # runner checks out LF, so a mismatch here is a real mismatch and not a
      # line-ending artefact -- unlike a Windows working copy, where it is
      # usually the reverse. Four verifiers in this estate hashed the working
      # copy rather than the bytes served before that was fixed, the proof
      # itself among them.
      - name: The composition matches what is declared and hashed
        run: node tools/scope/verify-compose.mjs

      - name: The composed cartridge passes its own proof
        run: node tools/proofs/run-current.mjs

      - name: The scope ledger and workflow budget still hold
        run: |
          node tools/scope/loop.mjs lint
          node tools/scope/loop.mjs state

      # STATE.md is generated deterministically. If running the generator
      # changes it, the committed file was stale, and a stale durable-state
      # file is how a session picks up a wrong picture of the estate.
      - name: STATE.md was regenerated before it was committed
        run: git diff --exit-code -- STATE.md

      # Linux compliance, enforced rather than intended.
      #
      # .gitattributes pins every text file to LF in the working copy as well
      # as the blob, which removes the class of defect that appeared four times
      # in one evening: a file on disk that is not the file that ships, so
      # anything reading the disk answers differently depending on the machine.
      #
      # A CR at the end of a shebang line is the sharpest version. The kernel
      # then looks for an interpreter whose name ends in a carriage return and
      # reports "bad interpreter" against a path that plainly exists.
      - name: No CRLF survives in a tracked text file
        run: |
          set -euo pipefail
          # git ls-files --eol reports the index and working-tree endings for
          # every tracked file. On a runner both must be lf; i/crlf would mean
          # a blob carrying CRLF, which is what ships.
          if git ls-files --eol | grep -E 'i/crlf|i/mixed|w/crlf|w/mixed'; then
            echo "the files listed above are not LF"
            exit 1
          fi
          echo "every tracked text file is LF, on disk and in the blob"

      - name: Renormalising changes nothing, so .gitattributes is being obeyed
        run: |
          set -euo pipefail
          git add --renormalize .
          if ! git diff --cached --quiet; then
            echo "these files are not stored as .gitattributes requires:"
            git diff --cached --name-only
            exit 1
          fi
          echo "the index already agrees with .gitattributes"

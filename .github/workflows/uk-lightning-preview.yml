name: UK lightning isolated preview versus baseline
on:
  pull_request:
    paths:
      - 'atlas/preview/lightning/**'
      - 'atlas/cartridges/202610230100-streaming-parquet-bridge-v9-5.js'
      - 'tools/proofs/uk-lightning-preview.browser.mjs'
      - '.github/workflows/uk-lightning-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install chromium
      - name: Compare baseline and lightning preview on desktop/mobile
        run: node tools/proofs/uk-lightning-preview.browser.mjs
      - name: Preserve comparative screenshots and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uk-lightning-menu-comparison
          path: work/uk-lightning-preview
          retention-days: 14

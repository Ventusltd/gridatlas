name: Finding loop candidate proof

on:
  push:
    paths:
      - 'atlas/**'
      - 'data/repd_browser_registry_202608290716.json'
      - 'tools/proofs/**'
      - '.github/workflows/20260904-finding-loop-candidate.yml'
  pull_request:
    paths:
      - 'atlas/**'
      - 'data/repd_browser_registry_202608290716.json'
      - 'tools/proofs/**'
      - '.github/workflows/20260904-finding-loop-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finding-loop-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use pinned Node runtime action
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Record exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-receipt
          node -e "const fs=require('node:fs'),cp=require('node:child_process'); const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(); if(head!==process.env.GITHUB_SHA) throw new Error('checkout SHA mismatch'); fs.writeFileSync('candidate-receipt/head.json',JSON.stringify({schema:'gridatlas.finding-loop-ci-receipt.v1',github_sha:process.env.GITHUB_SHA,checked_out_head:head},null,2)+'\n');"

      - name: Run cumulative finding-loop candidate proof
        shell: bash
        run: |
          set -euo pipefail
          node atlas/codex/20260904-finding-loop-30x/proof.mjs | tee candidate-receipt/finding-loop-proof.txt

      - name: Run currently composed cartridge proofs
        shell: bash
        run: |
          set -euo pipefail
          node tools/proofs/run-current.mjs | tee candidate-receipt/current-cartridge-proofs.txt

      - name: Check full candidate patch whitespace
        run: git diff --check 7e3bdcbdab58ab22bdcd4d8aedc068baa7d02c6d HEAD

      - name: Upload exact-head proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: finding-loop-candidate-${{ github.sha }}
          path: candidate-receipt/
          if-no-files-found: error
          retention-days: 14

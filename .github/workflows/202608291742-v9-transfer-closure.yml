name: 202608291742 V9 transfer closure gate
run-name: V9 transfer closure ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608291742-v9-transfer-closure.yml'
      - '.github/workflows/202608291742-promote-root-current.yml'
      - 'state/live-set.json'
      - 'releases/current-v3.json'
      - '*-atlas-v9/**'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions: {}

concurrency:
  group: gridatlas-v9-transfer-closure
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  closure:
    name: Prove V8 accounted, V9 live and promotion-safe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact main commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact current pointer and immutable app release
        id: app
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test -f state/live-set.json
          test -f releases/current-v3.json
          cmp state/live-set.json releases/current-v3.json

          jq -e '
            .schema == "gridatlas.live-set.v3" and
            .classification == "VERIFIED_LIVE_ATLAS_V9" and
            .verification.promotion_eligible == true and
            .verification.real_duckdb_wasm == true and
            .verification.real_parquet_range_206 == true and
            .verification.rendered_all_sentinels == true and
            .verification.initial_v8_parquet_requests == 0 and
            .verification.missing_map_identities == 0 and
            .current.query_contract.identity_rule == "EXACT_REPD_REF_ONLY" and
            .current.query_contract.parameter == "repd_ref"
          ' state/live-set.json >/dev/null

          RELEASE_ID="$(jq -r .current.release_id state/live-set.json)"
          LIVE_URL="$(jq -r .current.live_url state/live-set.json)"
          test "$RELEASE_ID" != "null"
          [[ "$RELEASE_ID" =~ ^[0-9]{12}-atlas-v9$ ]]
          test "$LIVE_URL" = "https://ventusltd.github.io/gridatlas/$RELEASE_ID/"
          test -f "$RELEASE_ID/release-manifest.json"
          test -f "$RELEASE_ID/build-manifest.json"
          test -f "$RELEASE_ID/index.html"

          test "$(sha256sum "$RELEASE_ID/release-manifest.json" | cut -d' ' -f1)" = \
            "$(jq -r .current.release_manifest_sha256 state/live-set.json)"
          test "$(sha256sum "$RELEASE_ID/build-manifest.json" | cut -d' ' -f1)" = \
            "$(jq -r .current.build_manifest_sha256 state/live-set.json)"

          jq -e --arg release "$RELEASE_ID" --arg live "$LIVE_URL" '
            .schema == "gridatlas.timestamped-live-release.v1" and
            .classification == "LIVE_RELEASE" and
            .release_id == $release and
            .live_url == $live and
            .current == true and
            .immutable == true and
            .loading_contract.automatic_v8_layer_loads == 0 and
            .loading_contract.parquet_on_boot == 0 and
            .loading_contract.routing_projects_without_deep_link == 0 and
            .loading_contract.browser_compute == true and
            .truth_contract.v8_untouched == true and
            .truth_contract.repd_address_search_preserved == true and
            .truth_contract.routing_identity_is_exact_repd_ref == true and
            .truth_contract.proximity_establishes_identity == false and
            .truth_contract.operator_or_applicant_is_current_owner_claim == false
          ' "$RELEASE_ID/release-manifest.json" >/dev/null

          mkdir -p work/public-app
          for relative in state/live-set.json releases/current-v3.json; do
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 60 \
              --header 'Accept-Encoding: identity' \
              "https://ventusltd.github.io/gridatlas/$relative" \
              -o "work/public-app/$(basename "$relative")"
          done
          cmp state/live-set.json work/public-app/live-set.json
          cmp releases/current-v3.json work/public-app/current-v3.json

          while IFS=$'\t' read -r relative expected_sha expected_bytes; do
            test -n "$relative"
            [[ "$relative" != /* ]]
            [[ "$relative" != *".."* ]]
            local_path="$RELEASE_ID/$relative"
            test -f "$local_path"
            test "$(wc -c < "$local_path" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$local_path" | cut -d' ' -f1)" = "$expected_sha"
            public_path="work/public-app/$(printf '%s' "$relative" | tr '/' '_')"
            curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
              --header 'Accept-Encoding: identity' \
              "$LIVE_URL$relative" -o "$public_path"
            test "$(wc -c < "$public_path" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$public_path" | cut -d' ' -f1)" = "$expected_sha"
          done < <(jq -r '.files[] | [.path,.sha256,(.bytes|tostring)] | @tsv' "$RELEASE_ID/build-manifest.json")

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "live_url=$LIVE_URL" >> "$GITHUB_OUTPUT"

      - name: Prove the complete V8 data corpus is accounted for
        id: data
        shell: bash
        run: |
          set -euo pipefail
          DATA_ID="$(jq -r .current.data_release_id state/live-set.json)"
          DATA_RELEASE_SHA="$(jq -r .current.data_release_sha256 state/live-set.json)"
          [[ "$DATA_ID" =~ ^[0-9]{12}-data-gridatlas$ ]]
          DATA_URL="https://ventusltd.github.io/data-gridatlas/$DATA_ID/"
          mkdir -p work/data

          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$DATA_URL/release.json" -o work/data/release.json
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$DATA_URL/data/manifest.json" -o work/data/manifest.json
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$DATA_URL/contracts/202608290904-v8-quarantine.json" -o work/data/quarantine.json

          test "$(sha256sum work/data/release.json | cut -d' ' -f1)" = "$DATA_RELEASE_SHA"
          MANIFEST_SHA="$(jq -r .candidate.candidate_manifest_sha256 work/data/release.json)"
          test "$(sha256sum work/data/manifest.json | cut -d' ' -f1)" = "$MANIFEST_SHA"

          jq -e '
            .classification == "LIVE_IMMUTABLE_DATA_RELEASE" and
            .authority_licence_and_quarantine_labels_preserved == true and
            .candidate_closure.sources == 56 and
            .candidate_closure.layers == 60 and
            .candidate_closure.features == 541282 and
            .candidate_closure.layer_membership_rows == 526388 and
            .candidate_closure.wired_sources == 40 and
            .candidate_closure.unwired_sources == 16 and
            (.candidate_closure.wired_sources + .candidate_closure.unwired_sources) == .candidate_closure.sources
          ' work/data/release.json >/dev/null

          jq -e '
            .schema == "data-gridatlas.v8-transplant-manifest.v1" and
            .classification == "FULL_V8_TRANSPLANT_CANDIDATE" and
            .raw_geojson_outputs == 0 and
            .closure.sources == 56 and
            .closure.layers == 60 and
            .closure.features == 541282 and
            .closure.layer_membership_rows == 526388 and
            ([.artifacts[] | select(.path | endswith(".parquet"))] | length) == 65
          ' work/data/manifest.json >/dev/null

          jq -e '
            .schema == "data-gridatlas.v8-quarantine.v1" and
            .default_disposition == "QUARANTINE_UNTIL_PROVEN" and
            (.unwired_atlas_data | length) == 16 and
            (.unwired_atlas_data | unique | length) == 16 and
            ([.known_defects[].id] | index("metro_tram_geometry_mismatch")) != null and
            ([.known_defects[].id] | index("browser_side_topology_mutation")) != null and
            ([.known_defects[].id] | index("unversioned_fetch_without_hash")) != null
          ' work/data/quarantine.json >/dev/null

          echo "data_release_id=$DATA_ID" >> "$GITHUB_OUTPUT"
          echo "data_url=$DATA_URL" >> "$GITHUB_OUTPUT"

      - name: Prove exact REPD deep-link routing closure
        id: routing
        shell: bash
        run: |
          set -euo pipefail
          ROUTING_ID="$(jq -r .current.routing_release_id state/live-set.json)"
          ROUTING_SHA="$(jq -r .current.routing_release_sha256 state/live-set.json)"
          PROJECTS_SHA="$(jq -r .current.routing_projects_sha256 state/live-set.json)"
          [[ "$ROUTING_ID" =~ ^[0-9]{12}-repd-routing$ ]]
          ROUTING_URL="https://ventusltd.github.io/data-gridatlas/$ROUTING_ID/"
          mkdir -p work/routing

          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$ROUTING_URL/release.json" -o work/routing/release.json
          curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$ROUTING_URL/projects.json" -o work/routing/projects.json

          test "$(sha256sum work/routing/release.json | cut -d' ' -f1)" = "$ROUTING_SHA"
          test "$(sha256sum work/routing/projects.json | cut -d' ' -f1)" = "$PROJECTS_SHA"

          jq -e '
            .schema == "data-gridatlas.repd-routing-release.v1" and
            .classification == "IMMUTABLE_REPD_ROUTING_RELEASE" and
            .immutable == true and
            .consumer_contract.identity_key == "repd_ref" and
            .consumer_contract.select_only_geometry_status_valid == true and
            .coverage.projects == 7680 and
            .coverage.unique_numeric_repd_refs == 7680 and
            .coverage.map_identities == 7652 and
            .coverage.no_map_identities == 28 and
            (.coverage.map_identities + .coverage.no_map_identities) == .coverage.projects
          ' work/routing/release.json >/dev/null

          test "$(jq -r .current.routing_map_identities state/live-set.json)" = "7652"
          test "$(jq -r .current.routing_no_map_identities state/live-set.json)" = "28"
          test "$(jq -r .current.selectable_union state/live-set.json)" = "13452"
          test "$(jq -r .verification.no_map_selectable_intersection state/live-set.json)" = "0"
          test "$(jq -r .verification.routing_without_deep_link_requests state/live-set.json)" = "0"

          echo "routing_release_id=$ROUTING_ID" >> "$GITHUB_OUTPUT"
          echo "routing_url=$ROUTING_URL" >> "$GITHUB_OUTPUT"

      - name: Emit immutable closure attestation
        shell: bash
        env:
          RELEASE_ID: ${{ steps.app.outputs.release_id }}
          LIVE_URL: ${{ steps.app.outputs.live_url }}
          DATA_RELEASE_ID: ${{ steps.data.outputs.data_release_id }}
          ROUTING_RELEASE_ID: ${{ steps.routing.outputs.routing_release_id }}
        run: |
          set -euo pipefail
          mkdir -p work
          jq -n \
            --arg schema "gridatlas.v9-transfer-closure.v1" \
            --arg classification "VERIFIED_V8_TO_V9_TRANSFER_CLOSURE" \
            --arg generation "202608291742" \
            --arg head_sha "$(git rev-parse HEAD)" \
            --arg release_id "$RELEASE_ID" \
            --arg live_url "$LIVE_URL" \
            --arg data_release_id "$DATA_RELEASE_ID" \
            --arg routing_release_id "$ROUTING_RELEASE_ID" \
            '{
              schema: $schema,
              classification: $classification,
              generation: $generation,
              head_sha: $head_sha,
              app: {release_id: $release_id, live_url: $live_url, verified: true},
              data: {
                release_id: $data_release_id,
                sources: 56,
                wired_sources: 40,
                quarantined_unwired_sources: 16,
                layers: 60,
                features: 541282,
                memberships: 526388,
                parquet_files: 65,
                all_v8_sources_accounted: true
              },
              routing: {
                release_id: $routing_release_id,
                projects: 7680,
                map_identities: 7652,
                no_map_identities: 28,
                exact_repd_ref_only: true
              },
              root_promotion_eligible: true,
              failed: 0
            }' > work/v9-transfer-closure.json
          cat work/v9-transfer-closure.json
          {
            echo "## V9 transfer closure"
            echo
            echo "- App: \`$RELEASE_ID\`"
            echo "- V8 sources accounted: **56/56**"
            echo "- Wired V8 runtime sources: **40**"
            echo "- Explicitly quarantined unwired V8 files: **16**"
            echo "- Layers: **60**"
            echo "- Features: **541,282**"
            echo "- REPD routing: **7,680/7,680 identities accounted**"
            echo "- Root promotion: **eligible**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain closure evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gridatlas-202608291742-v9-transfer-closure-${{ github.sha }}
          path: work/v9-transfer-closure.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

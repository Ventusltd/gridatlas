name: PR file size guard and cartridge gate

# One workflow file, because the active-workflow budget in
# tools/scope/lib.mjs (ACTIVE_WORKFLOWS) is exact and every other entry on it is
# disabled in the repository settings, 202608312212-cartridge-proof.yml
# included. This is the one workflow that runs on every pull request, so the
# gate lives here rather than as a tenth file. See docs/CI.md.
#
# size-guard: fails a pull request that adds or grows a file beyond MAX_MB, unless the path
# is listed in .github/large-files-allowlist.txt (exact paths or shell globs,
# one per line, '#' comments). Runs on pull requests only: pushes to main are
# deliberately not checked so the existing bots that commit generated data to
# main keep working. Existing large files are allowlisted so current content
# does not break the check; the goal is to stop NEW bulk data arriving via PR.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-file-size-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  satnav-native-browser:
    if: github.event.pull_request.head.ref == 'feature/satnav-native-vicinity-m1-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify the preview rebuild and existing station index
        run: |
          node tools/satnav/build.mjs
          git diff --exit-code
          node --test tools/train/core.test.mjs
      - name: Install isolated Playwright Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/satnav-python"
          "$RUNNER_TEMP/satnav-python/bin/python" -m pip install --require-virtualenv playwright==1.63.0
          "$RUNNER_TEMP/satnav-python/bin/python" -m playwright install --with-deps chromium
      - name: Run actual native SatNav and pinned compass handoff
        run: |
          repo="$PWD"
          node tools/satnav/serve.mjs 8768 > "$RUNNER_TEMP/satnav-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry-connrefused --retry 8 --output /dev/null \
            http://127.0.0.1:8768/atlas/v/satnav-native-m1/
          mkdir -p "$RUNNER_TEMP/satnav-browser"
          cd "$RUNNER_TEMP/satnav-browser"
          "$RUNNER_TEMP/satnav-python/bin/python" "$repo/tools/satnav/browser.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: satnav-native-chromium-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/satnav-server.log
            ${{ runner.temp }}/satnav-browser/
          if-no-files-found: ignore
          retention-days: 14

  vicinity-v9197-real-layers:
    if: startsWith(github.event.pull_request.head.ref, 'fix/v9197-fullscreen-layers-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Exact source, inherited SHA pins and fullscreen event delegation
        run: node tools/proofs/202611222343-vicinity-controls-rescue.proof.mjs
      - name: Headless visible Layers - V9.195 working, V9.196 broken, V9.197 fixed in portrait and landscape
        run: VICINITY_BROWSER=${{ matrix.browser }} node tools/proofs/202611222343-layers-visible.browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vicinity-v9197-layers-${{ matrix.browser }}-${{ github.run_id }}
          path: work/vicinity-v9197-${{ matrix.browser }}
          retention-days: 14

  vicinity-v9196-real-receiver:
    if: startsWith(github.event.pull_request.head.ref, 'fix/v9196-vicinity-a4-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: node tools/proofs/202611222325-vicinity-controls-rescue.proof.mjs
      - name: Actual PipelineNews MAP and PDF URI to real GridAtlas with original Grid Engine and touch-hit Layers
        run: VICINITY_BROWSER=${{ matrix.browser }} node tools/proofs/202611222325-vicinity-a4.browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vicinity-v9196-${{ matrix.browser }}-${{ github.run_id }}
          path: work/vicinity-v9196-${{ matrix.browser }}
          retention-days: 14

  # Native V9.194 vicinity gate uses this existing PR workflow. The Atlas
  # repository intentionally caps the number of active workflow files at nine.
  vicinity-v9194-browser:
    if: startsWith(github.event.pull_request.head.ref, 'feature/v9194-pipeline-vicinity-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Byte-pinned native vicinity source and no Journey
        run: node tools/proofs/202611222000-vicinity-entry.proof.mjs
      - name: Real browser MAP, vicinity, 90-point swipe and Hide Layers
        run: VICINITY_BROWSER=${{ matrix.browser }} node tools/proofs/202611222000-vicinity-entry.browser.mjs
      - name: Preserve browser images and diagnostic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vicinity-v9194-${{ matrix.browser }}-${{ github.run_id }}
          path: work/vicinity-v9194-${{ matrix.browser }}
          retention-days: 14

  # V9.195: the asset-first candidate is not a public release. Headless phone
  # Chromium/WebKit must demonstrate focused detail cards, hidden Layout Sandbox
  # and restored existing controls before any owner-reviewed promotion.
  vicinity-v9195-browser:
    if: startsWith(github.event.pull_request.head.ref, 'feature/v9195-vicinity-focus-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: V9.194 preserved and V9.195 focus SHA-256 pinned
        run: node tools/proofs/202611222130-vicinity-focus.proof.mjs
      - name: Project and selected asset card on emulated phone
        run: VICINITY_BROWSER=${{ matrix.browser }} node tools/proofs/202611222130-vicinity-focus.browser.mjs
      - name: Keep screenshots and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vicinity-v9195-${{ matrix.browser }}-${{ github.run_id }}
          path: work/vicinity-v9195-${{ matrix.browser }}
          retention-days: 14

  # V9.195 release preparation: source-only branch verifies the target G
  # independent of the currently live V9.194 pointer. This avoids a false
  # green where default twin targets only previous/live data generations.
  vicinity-v9195-promotion-source:
    if: startsWith(github.event.pull_request.head.ref, 'prep/v9195-release-forward-compat-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Prove both immutable V9.195 cartridges and preview contract
        run: |
          node tools/proofs/202611222130-sld-sandbox.proof.mjs
          node tools/proofs/202611222130-vicinity-focus.proof.mjs
      - name: Rebuild V9.195 in an independent source-only twin
        run: node tools/twin/replicate-generation.mjs --offline --generation 202611222130

  grid-explorer-browser:
    if: github.event_name == 'pull_request' && (startsWith(github.event.pull_request.head.ref, 'train-conductor/atlas-') || startsWith(github.event.pull_request.head.ref, 'train-conductor/atlas2-') || startsWith(github.event.pull_request.head.ref, 'release/202611'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Select newest explorer candidate
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const rows=fs.readdirSync('atlas/manifests').filter(f=>f.endsWith('-composition.json')).map(f=>JSON.parse(fs.readFileSync('atlas/manifests/'+f))).filter(m=>m.acceptance?.stage==='native'||m.acceptance?.stage==='vicinity').sort((a,b)=>a.generation.localeCompare(b.generation));const latest=rows.at(-1);if(!latest)throw Error('No explorer candidate');const native=rows.filter(m=>m.acceptance.stage==='native').at(-1);fs.appendFileSync(process.env.GITHUB_ENV,'JOURNEY_BROWSER_GENERATION='+native.generation+'\nEXPLORER_GENERATION='+latest.generation+'\n');"
      - name: Source and native map acceptance
        env:
          JOURNEY_BROWSER_OUTPUT: ${{ runner.temp }}/gridatlas-gj03-browser-candidate
        run: |
          node --test tools/journey/controller.test.mjs tools/sld/build.test.mjs tools/sld/mobile-arrival-card.test.mjs
          node tools/journey/contract.test.mjs
          node tools/journey/browser.test.mjs
          node tools/twin/replicate-generation.mjs --generation "$EXPLORER_GENERATION" --offline
          if test -f tools/sld/map-removal-cleanup.test.mjs; then node --test tools/sld/map-removal-cleanup.test.mjs; fi
          if test -d tools/pipeline-lifecycle; then node --test tools/pipeline-lifecycle/*.test.mjs; fi
          if test -d tools/train; then node --test tools/train/core.test.mjs tools/train/route-plan.test.mjs tools/train/scenario.test.mjs tools/train/train-motion.test.mjs tools/train/painted-observation.test.mjs tools/train/gazetteer/lookup.test.mjs; fi
          if test -f tools/vicinity/model.test.mjs; then node --test tools/vicinity/model.test.mjs tools/vicinity/asset-context.test.mjs tools/vicinity/document-context.test.mjs; fi
      - name: Native vicinity and train acceptance in Chromium and WebKit
        run: |
          if node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('atlas/manifests/'+process.env.EXPLORER_GENERATION+'-composition.json'));process.exit(m.acceptance?.stage==='vicinity'?0:1)"; then
            for engine in chromium webkit; do
              VICINITY_BROWSER_ENGINE="$engine" VICINITY_BROWSER_GENERATION="$EXPLORER_GENERATION" VICINITY_BROWSER_OUTPUT="$RUNNER_TEMP/gridatlas-vicinity-train-$engine" VICINITY_BROWSER_INJECT=0 node tools/vicinity/browser.test.mjs
            done
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grid-explorer-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/gridatlas-gj03-browser-*/
            ${{ runner.temp }}/gridatlas-vicinity-*/
          retention-days: 14

  size-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAX_MB: '5'
      ALLOWLIST: .github/large-files-allowlist.txt
    steps:
      # Blobless and sparse: only .github/ is materialised, so this stays fast
      # even in repositories that carry hundreds of megabytes of data. Blobs
      # for the PR's own changed files are fetched lazily when sized below.
      - name: Checkout the PR merge commit (blobless, sparse, no history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
          sparse-checkout-cone-mode: true

      - name: Fetch the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"

      - name: Check added or modified files against the size budget
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          limit=$(( MAX_MB * 1024 * 1024 ))

          allow=()
          if [ -f "$ALLOWLIST" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%%#*}"
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              [ -n "$line" ] && allow+=("$line")
            done < "$ALLOWLIST"
          fi

          allowed() {
            local p="$1" pat
            for pat in "${allow[@]+"${allow[@]}"}"; do
              # shellcheck disable=SC2053
              [[ "$p" == $pat ]] && return 0
            done
            return 1
          }

          failed=0
          checked=0
          {
            echo "## PR file size guard"
            echo ""
            echo "Limit: ${MAX_MB} MB per file (added or modified files, allowlist: \`$ALLOWLIST\`)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # HEAD is the merge of the PR into its base, so diffing it against the
          # base commit yields exactly the PR's own additions and modifications.
          while IFS= read -r -d '' path; do
            [ -n "$path" ] || continue
            size=$(git cat-file -s "HEAD:$path" 2>/dev/null || echo 0)
            checked=$((checked + 1))
            if [ "$size" -gt "$limit" ]; then
              mb=$(awk -v b="$size" 'BEGIN { printf "%.1f", b / 1048576 }')
              if allowed "$path"; then
                echo "allowlisted  ${mb} MB  $path"
                echo "- allowlisted: \`$path\` (${mb} MB)" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::error file=$path::$path is ${mb} MB, over the ${MAX_MB} MB limit. Publish it as a release asset, a workflow artifact, or an external dataset, or add it to $ALLOWLIST with a reason."
                echo "- FAIL: \`$path\` (${mb} MB)" >> "$GITHUB_STEP_SUMMARY"
                failed=1
              fi
            fi
          done < <(git diff --name-only -z --diff-filter=AM "$BASE_SHA" HEAD)

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Files checked: $checked" >> "$GITHUB_STEP_SUMMARY"
          echo "checked $checked added/modified files against a ${MAX_MB} MB limit"
          if [ "$failed" -ne 0 ]; then
            echo "One or more files exceed the size budget. See the annotations above." >&2
            exit 1
          fi
          echo "All files within budget."

  # The checks that were run by hand before every cut, run on every PR:
  # loop.mjs lint and STATE.md parity, the proof of every generation the PR
  # touches and of the one atlas/current.json points to, run-current,
  # verify-compose, loader byte identity for atlas/v/<gen>/index.html, and the
  # vendored lightning overlay node suite. Node built-ins only: no npm install,
  # no browser, no network, no secrets. The browser proofs stay in
  # 202608312212-cartridge-proof.yml.
  cartridge-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pinned exactly: the version every local gate run of 28 Oct 2026 used.
      NODE_VERSION: '22.23.4'
    steps:
      - name: Checkout the PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the base commit the PR is diffed against
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Immutable proof anchor for the V9.191 no-copy assertion. Keep the checkout shallow.
          git fetch --no-tags --depth=1 origin 76653e40cf883e39497a0859d2532eb8b05930b1

      - name: Node (exact pin)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The runner is on the pinned Node
        run: |
          test "$(node --version)" = "v${NODE_VERSION}" || { echo "node $(node --version) is not the pinned v${NODE_VERSION}"; exit 1; }
          node --version

      - name: Cartridge gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/ci/pr-gate.mjs --base "$BASE_SHA"

  # The twin (docs/CI.md, "Twin, preservation and keys"): the live generation's
  # data files rebuilt from the commit-pinned source register with the pinned
  # Python libraries, and compared byte for byte with the committed files.
  # `needs: cartridge-gate` is the ordering rule: the offline gate (which
  # already ran preservation, the offline twin and the keys) is green before
  # this job opens a socket. Read-only: it fetches two pinned files and pip
  # packages, writes nothing to the repository and uses no secret.
  twin:
    needs: cartridge-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the PR merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the base commit the PR is diffed against
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Immutable proof anchor for the V9.191 no-copy assertion. Keep the checkout shallow.
          git fetch --no-tags --depth=1 origin 76653e40cf883e39497a0859d2532eb8b05930b1
      - name: Node (exact pin)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22.23.4'
      - name: Rebuild the live generation from its pinned source and compare every byte
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --name-only --no-renames "$BASE_SHA" HEAD | grep -Eq '^(atlas|data|compiler|tools)/'; then
            echo "The PR touches none of atlas/, data/, compiler/, tools/: twin not run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/twin-venv"
          "$RUNNER_TEMP/twin-venv/bin/pip" install --quiet --require-virtualenv -r requirements.lock
          status=0
          node tools/twin/replicate-generation.mjs --network --python "$RUNNER_TEMP/twin-venv/bin/python" 2>&1 | tee "$RUNNER_TEMP/twin.log" || status=$?
          { echo '## Twin'; echo; echo '```'; cat "$RUNNER_TEMP/twin.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Real Chromium check on every preview/ PR (NL-007), for the generation
  # named in DC_SMOKE_GENERATION at line 177. This does not deploy, change
  # the live pointer or use secrets; keep the reusable script.
  dc-browser-smoke:
    if: startsWith(github.event.pull_request.head.ref, 'preview/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate with real preview files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: '22.23.4'
      - name: Install headless Chromium for actual phone/desktop map taps
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Slough tap, four tabs, link reveal and CSV in Chromium
        env:
          DC_SMOKE_GENERATION: '202610312138'
        run: node tools/ci/offtakers/browser-dc-smoke.mjs
      - name: Preserve screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dc-browser-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/gridatlas-dc-browser/
          if-no-files-found: ignore

  map-receiver-browser:
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/v925-map-receiver' || github.event.pull_request.head.ref == 'fix/v9191-release-contract' || github.event.pull_request.head.ref == 'fix/v9191-promoted-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAP_RECEIVER_GENERATION: ${{ github.event.pull_request.head.ref == 'fix/v925-map-receiver' && '202611161645' || '202611161720' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare shallow proof history
        run: |
          test "$(git rev-parse --is-shallow-repository)" = true
          git fetch --no-tags --depth=1 origin 76653e40cf883e39497a0859d2532eb8b05930b1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/proofs/${MAP_RECEIVER_GENERATION}-sld-sandbox.proof.mjs
      - name: Real release and byte-exact route-C rollback rehearsal
        if: github.event.pull_request.head.ref == 'fix/v9191-release-contract' || github.event.pull_request.head.ref == 'fix/v9191-promoted-gate'
        run: |
          git config user.name "GridAtlas rehearsal"
          git config user.email "rehearsal@users.noreply.github.com"
          node tools/release/map-promotion-rehearsal.mjs
      - name: Real MAP clicks and visible calculation results
        run: node tools/proofs/map-receiver-restoration.browser.mjs
      - name: Stalled declared-connection lookup remains explicit
        env:
          NESO_TIMEOUT: '1'

name: V9.194 PipelineNews GridAtlas vicinity preview
on:
  pull_request:
    paths:
      - 'atlas/modules/202611222000-*'
      - 'atlas/v/202611222000/**'
      - 'atlas/manifests/202611222000-*'
      - 'tools/proofs/202611222000-*'
      - '.github/workflows/v9194-vicinity-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridatlas-v9194-vicinity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-hashes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node tools/proofs/202611222000-vicinity-entry.proof.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Render real candidate composer and native REPD vicinity, swipe and hide-layer controls
        run: VICINITY_BROWSER=${{ matrix.browser }} node tools/proofs/202611222000-vicinity-entry.browser.mjs
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9194-vicinity-${{ matrix.browser }}
          path: work/vicinity-v9194-${{ matrix.browser }}
          retention-days: 14

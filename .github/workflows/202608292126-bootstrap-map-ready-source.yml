name: 202608292126 Bootstrap map-ready source programme
run-name: Install map-ready source programme ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608292126-bootstrap-map-ready-source.yml'
      - 'bootstrap/202608292126/**'

permissions:
  contents: write

concurrency:
  group: gridatlas-202608292126-bootstrap-source
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  install_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Decode, validate and compare-and-swap source programme
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          mapfile -t bootstrap_changed < <(git diff --name-only HEAD^ HEAD | sort)
          expected_bootstrap=(
            .github/workflows/202608292126-bootstrap-map-ready-source.yml
            bootstrap/202608292126/part-00.b64
            bootstrap/202608292126/part-01.b64
            bootstrap/202608292126/part-02.b64
            bootstrap/202608292126/part-03.b64
            bootstrap/202608292126/part-04.b64
            bootstrap/202608292126/part-05.b64
          )
          test "${bootstrap_changed[*]}" = "${expected_bootstrap[*]}"

          cat bootstrap/202608292126/part-*.b64 > /tmp/gridatlas-map-ready-source.tar.gz.b64
          base64 --decode /tmp/gridatlas-map-ready-source.tar.gz.b64 > /tmp/gridatlas-map-ready-source.tar.gz
          test "$(sha256sum /tmp/gridatlas-map-ready-source.tar.gz | cut -d' ' -f1)" = 65158de561bcb0c086b53e862640641f0cbf8ee4e92aab47283e17b793437c91
          test "$(tar -tzf /tmp/gridatlas-map-ready-source.tar.gz | wc -l)" = 10
          tar -xzf /tmp/gridatlas-map-ready-source.tar.gz -C .
          rm -rf bootstrap/202608292126
          rm .github/workflows/202608292126-bootstrap-map-ready-source.yml

          python -m py_compile compiler/202608292126-build-map-ready-v9.py
          node --check atman/202608292126-layer-performance-comparator.mjs
          node --check ui/v8-mirror/202608292126-map-ready-fetch-bridge.js
          node --check ui/v8-mirror/202608292126-pre-snapped-config-adapter.js
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('contracts/202608292126-map-ready-runtime.json'),
              Path('machine-learning/schemas/layer-performance-record-v1.schema.json'),
          ]:
              json.loads(path.read_text())
          PY

          git add -A
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/202608291430-build-verify-publish-atlas-v9.yml
            .github/workflows/202608291742-promote-root-current.yml
            .github/workflows/202608291742-v9-transfer-closure.yml
            .github/workflows/202608292126-bootstrap-map-ready-source.yml
            .github/workflows/202608292126-build-map-ready-v9.yml
            atman/202608292126-layer-performance-comparator.mjs
            bootstrap/202608292126/part-00.b64
            bootstrap/202608292126/part-01.b64
            bootstrap/202608292126/part-02.b64
            bootstrap/202608292126/part-03.b64
            bootstrap/202608292126/part-04.b64
            bootstrap/202608292126/part-05.b64
            compiler/202608292126-build-map-ready-v9.py
            contracts/202608292126-map-ready-runtime.json
            machine-learning/schemas/layer-performance-record-v1.schema.json
            ui/v8-mirror/202608292126-map-ready-fetch-bridge.js
            ui/v8-mirror/202608292126-pre-snapped-config-adapter.js
          )
          test "${#staged[@]}" = "${#expected[@]}"
          test "${staged[*]}" = "${expected[*]}"

          git config user.name gridatlas-map-ready-source-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608292126: install map-ready CI comparator programme'
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          echo "Installed source commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

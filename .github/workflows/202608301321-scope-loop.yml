# scope-loop-mode: retired
name: 202608301321 GridAtlas bounded scope loop

# BEGIN ACTIVE TRIGGERS
on:
  workflow_dispatch:
# END ACTIVE TRIGGERS

permissions:
  actions: write
  contents: write
  pages: write

concurrency:
  group: gridatlas-bounded-scope-loop
  cancel-in-progress: false

jobs:
  one-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GRIDATLAS_SCOPE_TOKEN || github.token }}
    steps:
      - name: Checkout exact main state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDATLAS_SCOPE_TOKEN || github.token }}

      - name: Materialise the timestamped scope ledger once
        id: bootstrap
        run: node tools/scope/bootstrap.mjs

      - name: Reconstruct durable context and lint antibodies
        run: |
          node --version
          node tools/scope/loop.mjs lint
          node tools/scope/loop.mjs state

      - name: Read the one active scope
        id: before
        run: node tools/scope/loop.mjs next

      - name: Execute exactly one deterministic scope
        id: advance
        if: steps.bootstrap.outputs.bootstrapped != 'true' && steps.before.outputs.pending == 'true'
        run: node tools/scope/advance.mjs

      - name: Verify composition and post-scope antibodies
        if: steps.bootstrap.outputs.bootstrapped != 'true' && steps.before.outputs.pending == 'true'
        run: |
          node tools/scope/verify-compose.mjs
          node tools/scope/loop.mjs lint
          node tools/scope/loop.mjs state

      - name: Commit the bounded scope
        id: commit
        if: steps.bootstrap.outputs.bootstrapped == 'true' || steps.before.outputs.pending == 'true'
        env:
          BOOTSTRAPPED: ${{ steps.bootstrap.outputs.bootstrapped }}
          ADVANCE_MESSAGE: ${{ steps.advance.outputs.commit_message }}
        run: |
          git config user.name "gridatlas-scope-loop"
          if [ "$BOOTSTRAPPED" = "true" ]; then
            COMMIT_MESSAGE="202608301321-gridatlas: establish durable scope ledger and antibodies"
          else
            COMMIT_MESSAGE="$ADVANCE_MESSAGE"
          fi
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request a Pages rebuild for the committed state
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Read successor after commit
        id: after
        if: steps.bootstrap.outputs.bootstrapped == 'true' || steps.before.outputs.pending == 'true'
        run: node tools/scope/loop.mjs next

      - name: Dispatch the next bounded scope in a new timestamp minute
        if: steps.after.outputs.pending == 'true'
        env:
          BOOTSTRAPPED: ${{ steps.bootstrap.outputs.bootstrapped }}
        run: |
          if [ "$BOOTSTRAPPED" = "true" ]; then sleep 5; else sleep 65; fi
          gh workflow run 202608301321-scope-loop.yml --ref main

      - name: Dispatch final public acceptance after closure
        if: steps.bootstrap.outputs.bootstrapped != 'true' && steps.before.outputs.pending == 'true' && steps.after.outputs.pending == 'false'
        run: |
          sleep 20
          gh workflow run 202608301321-verify-live.yml --ref main

name: 202608301321 Build, deploy and verify modular GridAtlas v9.5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'state/streaming-road-fix.json'
      - 'tools/v9_5/build_streaming_bridge.py'
      - 'atman/verify_streaming_roads.mjs'
      - '.github/workflows/202608301321-verify-live.yml'

permissions:
  actions: read
  contents: write
  pages: write

concurrency:
  group: gridatlas-v9-5-modular-promotion
  cancel-in-progress: false

jobs:
  build-deploy-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GRIDATLAS_SCOPE_TOKEN || github.token }}
      GRIDATLAS_BASE_URL: https://ventusltd.github.io/gridatlas/
      CVAA_SHA: d2ebc01f6eab41f2a84b0c53c4cfae0d2625ec5e
    steps:
      - name: Checkout complete GridAtlas history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GRIDATLAS_SCOPE_TOKEN || github.token }}

      - name: Checkout pinned CVAA with complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ventusltd/cvaa
          ref: ${{ env.CVAA_SHA }}
          path: work/cvaa
          fetch-depth: 0
          persist-credentials: false

      - name: Configure exact Node and Chromium
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install pinned browser runtime before reading the UTC generation
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Compile and locally commit one transport cartridge at the UTC minute
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          G="$(date -u +%Y%m%d%H%M)"
          echo "generation=$G" >> "$GITHUB_OUTPUT"
          mkdir -p work
          python3 tools/v9_5/build_streaming_bridge.py \
            --generation "$G" \
            --request state/streaming-road-fix.json \
            --report work/streaming-road-build.json
          node tools/scope/verify-compose.mjs
          test "$(jq -r .full_application_copies_created work/streaming-road-build.json)" = 0
          test "$(jq -r .immutable_shell_modified work/streaming-road-build.json)" = false
          test "$(jq -r .generation atlas/current.json)" = "$G"
          test "$(jq -r '.cartridge_order | join(",")' atlas/current.json)" = 'streaming-parquet-bridge,uk-gazetteer-flyto'

          cartridge="atlas/cartridges/${G}-streaming-parquet-bridge-v9-5.js"
          contract="ui/cartridges/${G}-streaming-parquet-bridge-v9-5.mjs"
          manifest="atlas/manifests/${G}-composition.json"
          git add atlas/current.json "$cartridge" "$contract" "$manifest"
          allowed="^(atlas/current.json|${cartridge}|${contract}|${manifest})$"
          test "$(git diff --cached --name-only | grep -Evc "$allowed" || true)" = 0
          git config user.name gridatlas-streaming-road-builder
          git config user.email actions@users.noreply.github.com
          git commit -m "$G-gridatlas-v9.5: stream Parquet response before body reconstruction"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prove selected CVAA contracts on the locally committed candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node work/cvaa/inoculate.mjs . --json --no-write > work/cvaa-candidate.txt 2>&1
          echo "$?" > work/cvaa-candidate.exit
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = Path('work/cvaa-candidate.txt').read_text(encoding='utf-8').splitlines()
          payload = None
          for line in reversed(rows):
              try:
                  candidate = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if candidate.get('schema') == 'cvaa.run.v1':
                  payload = candidate
                  break
          if payload is None:
              raise SystemExit('CVAA JSON result missing')
          if payload.get('shallow') is not False:
              raise SystemExit('CVAA saw a shallow checkout')
          states = {row['vaccine']: row for row in payload['results']}
          for vaccine in ('full-history-checkout', 'no-app-copies', 'registry-integrity', 'no-dangerous-apis'):
              row = states.get(vaccine)
              if not row or row.get('state') != 'immune':
                  raise SystemExit(f'{vaccine} is not immune: {row}')
          Path('work/cvaa-selected-gates.json').write_text(json.dumps({
              'schema': 'gridatlas.cvaa-selected-gates.v1',
              'cvaa_sha': 'd2ebc01f6eab41f2a84b0c53c4cfae0d2625ec5e',
              'selected': {name: states[name] for name in ('full-history-checkout', 'no-app-copies', 'registry-integrity', 'no-dangerous-apis')},
              'all_findings': payload.get('findings'),
          }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Serve the exact locally committed Pages path
        run: |
          set -euo pipefail
          mkdir -p work/site
          ln -s "$GITHUB_WORKSPACE" work/site/gridatlas
          python3 -m http.server 4173 --bind 127.0.0.1 --directory work/site > work/local-http.log 2>&1 &
          echo $! > work/local-http.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/gridatlas/atlas/current.json >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Prove A-road transport locally in Chromium
        env:
          GRIDATLAS_URL: http://127.0.0.1:4173/gridatlas/atlas/
          EXPECTED_GENERATION: ${{ steps.candidate.outputs.generation }}
          OUTPUT: work/streaming-road-local-proof.json
        run: node atman/verify_streaming_roads.mjs

      - name: Prove the existing search cartridge was not lost
        env:
          GRIDATLAS_URL: http://127.0.0.1:4173/gridatlas/atlas/
          EXPECTED_GENERATION: ${{ steps.candidate.outputs.generation }}
          OUTPUT: work/v9-5-search-local-proof.json
        run: node atman/202608301624-verify-v9-5-search.mjs

      - name: Stop local server
        if: always()
        run: test ! -f work/local-http.pid || kill "$(cat work/local-http.pid)" 2>/dev/null || true

      - name: Push only after local browser and CVAA gates pass
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.commit_sha }}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main

      - name: Request GitHub Pages deployment
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" && exit 0
            sleep 10
          done
          echo 'Pages build request was already active; public generation polling remains authoritative.'

      - name: Wait for the exact public composition
        env:
          GENERATION: ${{ steps.candidate.outputs.generation }}
        run: |
          set -euo pipefail
          public="${GRIDATLAS_BASE_URL}atlas/current.json"
          for attempt in $(seq 1 120); do
            payload="$(curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' "${public}?generation=${GENERATION}&attempt=${attempt}" || true)"
            if test -n "$payload" \
              && test "$(printf '%s' "$payload" | jq -r '.generation // empty')" = "$GENERATION" \
              && test "$(printf '%s' "$payload" | jq -r '.composition_version // empty')" = v9.5 \
              && test "$(printf '%s' "$payload" | jq -r '.cartridge_order | join(",")')" = 'streaming-parquet-bridge,uk-gazetteer-flyto'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Prove A-road transport on the public deployment
        env:
          GRIDATLAS_URL: https://ventusltd.github.io/gridatlas/atlas/
          EXPECTED_GENERATION: ${{ steps.candidate.outputs.generation }}
          OUTPUT: work/streaming-road-public-proof.json
        run: node atman/verify_streaming_roads.mjs

      - name: Prove public search and deep links remain intact
        env:
          GRIDATLAS_URL: https://ventusltd.github.io/gridatlas/atlas/
          EXPECTED_GENERATION: ${{ steps.candidate.outputs.generation }}
          OUTPUT: work/v9-5-search-public-proof.json
        run: node atman/202608301624-verify-v9-5-search.mjs

      - name: Retain source, CVAA and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: gridatlas-streaming-roads-${{ github.run_id }}
          path: |
            work/streaming-road-build.json
            work/cvaa-candidate.txt
            work/cvaa-candidate.exit
            work/cvaa-selected-gates.json
            work/streaming-road-local-proof.json
            work/streaming-road-public-proof.json
            work/v9-5-search-local-proof.json
            work/v9-5-search-public-proof.json
            work/local-http.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

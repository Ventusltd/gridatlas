name: 202609030251 Build GridAtlas v9.89 grid-data verified successor

on:
  workflow_dispatch:
  push:
    branches:
      - codex/202609030251-grid-data-v9-89

permissions:
  contents: write

concurrency:
  group: gridatlas-v9-89-grid-data-cut
  cancel-in-progress: false

jobs:
  cut-and-prove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gridatlas
    steps:
      - name: Checkout the exact candidate branch
        uses: actions/checkout@v4
        with:
          path: gridatlas
          fetch-depth: 5

      - name: Checkout canonical distance maths beside GridAtlas
        uses: actions/checkout@v4
        with:
          repository: Ventusltd/grid-distance-maths
          path: grid-distance-maths

      - name: Checkout the audited Pipeline News state beside GridAtlas
        uses: actions/checkout@v4
        with:
          repository: Ventusltd/pipelinenews
          ref: 1a9868e76f970f20590a4110acc337e92d360f94
          path: pipelinenews

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply the proof-led coherence repair to the cutter
        run: node tools/releases/202609030251-repair-v9-89-cutter.mjs

      - name: Cut v9.89 from the audited v9.88 parent
        run: node tools/releases/202609030251-cut-grid-data-v9-89.mjs

      - name: Re-run the two-repository arrival gate
        run: >-
          node tools/proofs/202609030251-pipelinenews-arrival-contract.mjs
          --pipelinenews ../pipelinenews
          --release 202609030009-pipelinenews

      - name: Prove deterministic state and LF storage
        run: |
          node tools/scope/verify-compose.mjs
          node tools/proofs/run-current.mjs
          node tools/scope/loop.mjs lint
          cp STATE.md /tmp/STATE.md.before
          node tools/scope/loop.mjs state
          if ! cmp -s /tmp/STATE.md.before STATE.md; then
            echo "STATE.md is not deterministic"
            diff -u /tmp/STATE.md.before STATE.md || true
            exit 1
          fi
          if git ls-files --eol | grep -E 'i/crlf|i/mixed|w/crlf|w/mixed'; then
            echo "a tracked text file is not LF"
            exit 1
          fi

      - name: Commit the immutable candidate
        run: |
          git config user.name "gridatlas-v9-89-builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "no generated successor to commit"
            exit 1
          fi
          git commit -m "feat: v9.89 accepts Pipeline News wider-fleet arrivals" \
            -m "Grid products remain pinned to data-grid-gb 1c9909d1138704b29235c27fd769436dda8a0b18. The candidate accepts the nine wider-fleet technology values plus the four spine values, proves the immutable 202609030009 Pipeline News payload, and records the three upstream duplicate identities without hiding them."
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Configure exact Node and locked public browser
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install locked public browser harness
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Execute live zero-fetch, routing sentinel and real DuckDB proof
        id: public
        run: |
          set -euo pipefail
          node atman/202608291430-public-browser-readback.mjs "$LIVE_URL" work/public/browser
          proof=work/public/browser/202608291430-public-browser-readback.json
          test "$(jq -r .classification "$proof")" = VERIFIED_PUBLIC_ROUTING_AND_DUCKDB_BROWSER
          test "$(jq -r .failed "$proof")" = 0
          test "$(jq -r .normal_registry_selectable_rows "$proof")" = 11033
          test "$(jq -r .base_map_features "$proof")" = 11033
          test "$(jq -r .routing_without_deep_link_requests "$proof")" = 0
          test "$(jq -r .initial_v8_parquet_requests "$proof")" = 0
          test "$(jq -r .duckdb_mode "$proof")" = real
          test "$(jq -r .real_visible_features "$proof")" -gt 0
          test "$(jq -r '.sentinels["12780"].selectable' "$proof")" = false
          test "$(jq -r '.sentinels["13429"].selectable' "$proof")" = false
          claim=work/public/browser/202608291430-public-browser-claim.json
          test "$(jq -r .classification "$claim")" = VERIFIED_PUBLIC_ROUTING_AND_DUCKDB_BROWSER
          test "$(jq -r .normal_registry_source_rows "$claim")" = 11069
          test "$(jq -r .normal_registry_selectable_rows "$claim")" = 11033
          test "$(jq -r .console_errors "$claim")" = 0
          public_browser_claim_sha256="$(sha256sum "$claim" | cut -d' ' -f1)"
          echo "public_browser_claim_sha256=$public_browser_claim_sha256" >> "$GITHUB_OUTPUT"

      - name: Write post-deploy release attestation
        env:
          RELEASE_COMMIT: ${{ needs.classify.outputs.release_commit }}
          SOURCE_COMMIT: ${{ needs.classify.outputs.source_commit }}
          PAGES_RUN_ID: ${{ steps.pages.outputs.pages_run_id }}
          PAGES_VERIFIED_AT: ${{ steps.pages.outputs.pages_verified_at }}
          PUBLIC_BROWSER_CLAIM_SHA256: ${{ steps.public.outputs.public_browser_claim_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg release_commit "$RELEASE_COMMIT" \
            --arg source_commit "$SOURCE_COMMIT" \
            --arg pages_run_id "$PAGES_RUN_ID" \
            --arg pages_verified_at "$PAGES_VERIFIED_AT" \
            --arg claim_sha "$PUBLIC_BROWSER_CLAIM_SHA256" \
            '{schema:"gridatlas.timestamped-routing-public-release-attestation.v1",classification:"VERIFIED_PUBLIC_ROUTING_ATLAS_V9",release_id:"202608291430-atlas-v9",live_url:"https://ventusltd.github.io/gridatlas/202608291430-atlas-v9/",release_commit:$release_commit,source_commit:$source_commit,pages_workflow_path:"dynamic/pages/pages-build-deployment",pages_run_id:($pages_run_id|tonumber),pages_verified_at:$pages_verified_at,public_browser_claim_sha256:$claim_sha,normal_registry_source_rows:11069,normal_registry_selectable_rows:11033,excluded_false_origin_rows:36,routing_map_identities:7652,routing_no_map_identities:28,routing_only_fallbacks:2419,selectable_union:13452,missing_map_identities:0,no_map_selectable_intersection:0,real_duckdb_wasm:true,initial_v8_parquet_requests:0}' \
            > work/public/202608291430-public-release-attestation.json

      - name: Upload public release attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-v9-${{ needs.classify.outputs.release_commit }}-public-attestation
          path: work/public/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90


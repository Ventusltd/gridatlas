          path: work/stage/202608291430-release-stage.json
          if-no-files-found: error
          retention-days: 90

  verify_public_release:
    name: Verify exact dynamic Pages deployment and real browser before pointer
    needs: [classify, verify_candidate]
    if: ${{ needs.classify.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      pages_run_id: ${{ steps.pages.outputs.pages_run_id }}
      pages_verified_at: ${{ steps.pages.outputs.pages_verified_at }}
      public_browser_claim_sha256: ${{ steps.public.outputs.public_browser_claim_sha256 }}
    steps:
      - name: Checkout exact App-promoted release without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.classify.outputs.release_commit }}
          fetch-depth: 4
          persist-credentials: false

      - name: Download this run's independently rebuilt accepted release
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: atlas-v9-${{ needs.classify.outputs.current_commit }}-${{ github.run_id }}-${{ github.run_attempt }}-accepted
          path: work/accepted

      - name: Reconfirm exact release tree and ancestry
        env:
          SOURCE_COMMIT: ${{ needs.classify.outputs.source_commit }}
          RELEASE_COMMIT: ${{ needs.classify.outputs.release_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          diff --recursive --no-dereference work/accepted/release "$RELEASE_ID"
          test "$(jq -r .source_commit "$RELEASE_ID/release-manifest.json")" = "$SOURCE_COMMIT"
          test "$(jq -r .classification work/accepted/proof/exhaustive-coverage.json)" = VERIFIED_EXHAUSTIVE_REPD_ROUTING_COVERAGE

      - name: Poll the exact dynamic Pages run for this release commit
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.classify.outputs.release_commit }}
        run: |
          set -euo pipefail
          mkdir -p work/public
          for attempt in $(seq 1 90); do
            response="$(curl --fail --silent --show-error --max-time 30 --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_COMMIT&per_page=50")"
            matches="$(jq -c --arg sha "$RELEASE_COMMIT" '[.workflow_runs[] | select(.path=="dynamic/pages/pages-build-deployment" and .head_sha==$sha)]' <<<"$response")"
            count="$(jq length <<<"$matches")"
            test "$count" -le 1
            if test "$count" = 1; then
              run="$(jq -c '.[0]' <<<"$matches")"
              test "$(jq -r .path <<<"$run")" = dynamic/pages/pages-build-deployment
              test "$(jq -r .head_sha <<<"$run")" = "$RELEASE_COMMIT"
              test "$(jq -r .head_branch <<<"$run")" = main
              test "$(jq -r .event <<<"$run")" = dynamic
              test "$(jq -r .run_attempt <<<"$run")" = 1
              run_id="$(jq -r .id <<<"$run")"
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r .conclusion <<<"$run")"
              if test "$status" = completed; then
                test "$conclusion" = success
                verified_at="$(jq -r .updated_at <<<"$run")"
                jq -S . <<<"$run" > work/public/202608291430-release-pages-run.json
                echo "pages_run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "pages_verified_at=$verified_at" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for dynamic/pages/pages-build-deployment at $RELEASE_COMMIT" >&2
          exit 1

      - name: Byte-read every public timestamp-folder file
        run: |
          set -euo pipefail
          mkdir -p work/public/files
          jq -r '.release_files | to_entries[] | [.key,.value.sha256] | @tsv' work/accepted/proof/atman-live-release.json | while IFS=$'\t' read -r relative expected; do
            target="work/public/files/$relative"
            mkdir -p "$(dirname "$target")"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 --max-time 90 "${LIVE_URL}${relative}?commit=${{ needs.classify.outputs.release_commit }}" -o "$target"

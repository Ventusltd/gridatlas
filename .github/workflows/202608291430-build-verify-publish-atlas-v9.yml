          git config user.name gridatlas-v9-stage-bot
          git config user.email actions@users.noreply.github.com
          source_date="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          GIT_AUTHOR_DATE="$source_date" GIT_COMMITTER_DATE="$source_date" git commit -m '202608291430: stage immutable exact-routing Atlas V9 for App promotion'
          stage_commit="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$SOURCE_COMMIT"
          remote_old="$(git ls-remote --heads origin "refs/heads/$RELEASE_STAGE_BRANCH" | awk '{print $1}')"
          if test -n "$remote_old"; then
            test "$remote_old" = "$stage_commit"
          else
            git push origin "HEAD:refs/heads/$RELEASE_STAGE_BRANCH"
          fi
          mkdir -p work/stage
          jq -n --arg branch "$RELEASE_STAGE_BRANCH" --arg source_commit "$SOURCE_COMMIT" --arg stage_commit "$stage_commit" \
            '{schema:"gridatlas.staged-release.v1",classification:"STAGED_ATLAS_V9_RELEASE",branch:$branch,source_commit:$source_commit,stage_commit:$stage_commit,main_unchanged:true,github_app_promotion_required:true}' \

name: 202608291430 Stage and verify exact-routing Atlas V9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608291239-build-verify-publish-atlas-v9.yml'
      - '.github/workflows/202608291430-build-verify-publish-atlas-v9.yml'
      - 'contracts/202608291430-atlas-v9-live-release.json'
      - 'compiler/202608291430-compile-atlas-v9-live.py'
      - 'atman/202608291430-verify-live-release.mjs'
      - 'atman/202608291430-compare-repd-coverage.mjs'
      - 'atman/202608291430-rendered-browser-audit.mjs'
      - 'atman/202608291430-public-browser-readback.mjs'
      - 'ui/successor-202608291430/**'
      - '202608291430-atlas-v9/**'
      - 'state/live-set.json'
      - 'releases/current-v3.json'
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Optional exact current main commit; defaults to the event commit
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gridatlas-202608291430-staged-publication
  cancel-in-progress: false

env:
  RELEASE_ID: 202608291430-atlas-v9
  PREDECESSOR_RELEASE_ID: 202608291239-atlas-v9
  DATA_RELEASE_ID: 202608291237-data-gridatlas
  DATA_BASE_URL: https://ventusltd.github.io/data-gridatlas/202608291237-data-gridatlas/
  ROUTING_RELEASE_ID: 202608291410-repd-routing
  ROUTING_BASE_URL: https://ventusltd.github.io/data-gridatlas/202608291410-repd-routing/
  ROUTING_PUBLICATION_COMMIT: b8668b4d5f34880158aeed2eab5c4a1e678a467d
  LIVE_URL: https://ventusltd.github.io/gridatlas/202608291430-atlas-v9/
  RELEASE_STAGE_BRANCH: ci/202608291430-atlas-v9
  POINTER_STAGE_BRANCH: ci/202608291430-pointer

jobs:
  classify:
    name: Classify immutable source, release or pointer phase
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.phase.outputs.mode }}
      current_commit: ${{ steps.phase.outputs.current_commit }}
      source_commit: ${{ steps.phase.outputs.source_commit }}
      release_commit: ${{ steps.phase.outputs.release_commit }}
    steps:
      - name: Checkout exact current main without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_main_sha || github.sha }}
          fetch-depth: 4
          persist-credentials: false

      - name: Require a linear append-only phase and exact source boundary
        id: phase
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$WORKFLOW_SHA" = "$EXPECTED_MAIN_SHA"
          git fetch --no-tags --depth=4 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test -f state/live-set.json
          test -f releases/current-v3.json
          cmp state/live-set.json releases/current-v3.json
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" = 2
          pointer_release="$(jq -r .current.release_id state/live-set.json)"
          if test ! -e "$RELEASE_ID" && test "$pointer_release" = "$PREDECESSOR_RELEASE_ID"; then
            mode=source
            source_commit="$EXPECTED_MAIN_SHA"
            release_commit=''
            test "$(git rev-parse HEAD^)" = 936a31f703d31bd975af22d7349708d68a143d56
            mapfile -t changed < <(git diff --name-only HEAD^ HEAD | sort)
            expected=(
              .github/workflows/202608291239-build-verify-publish-atlas-v9.yml
              .github/workflows/202608291430-build-verify-publish-atlas-v9.yml
              atman/202608291430-compare-repd-coverage.mjs
              atman/202608291430-public-browser-readback.mjs
              atman/202608291430-rendered-browser-audit.mjs
              atman/202608291430-verify-live-release.mjs
              compiler/202608291430-compile-atlas-v9-live.py
              contracts/202608291430-atlas-v9-live-release.json
              ui/successor-202608291430/assets/repd-routing-client.mjs
              ui/successor-202608291430/index.html
            )
            test "${#changed[@]}" = "${#expected[@]}"
            test "${changed[*]}" = "${expected[*]}"
          elif test -d "$RELEASE_ID" && test "$pointer_release" = "$PREDECESSOR_RELEASE_ID"; then
            mode=release
            source_commit="$(git rev-parse HEAD^)"
            release_commit="$EXPECTED_MAIN_SHA"
            git fetch --no-tags origin "refs/heads/$RELEASE_STAGE_BRANCH:refs/remotes/origin/$RELEASE_STAGE_BRANCH"
            test "$(git rev-parse "refs/remotes/origin/$RELEASE_STAGE_BRANCH")" = "$EXPECTED_MAIN_SHA"
            test "$(git rev-parse "$source_commit^")" = 936a31f703d31bd975af22d7349708d68a143d56
            test "$(jq -r .source_commit "$RELEASE_ID/release-manifest.json")" = "$source_commit"
            mapfile -t changed < <(git diff --name-only "$source_commit" "$release_commit" | sort)
            test "${#changed[@]}" = 8
            for changed_path in "${changed[@]}"; do case "$changed_path" in "$RELEASE_ID"/*) ;; *) exit 1 ;; esac; done
          elif test -d "$RELEASE_ID" && test "$pointer_release" = "$RELEASE_ID"; then
            mode=pointer
            release_commit="$(git rev-parse HEAD^)"
            source_commit="$(git rev-parse HEAD^^)"
            git fetch --no-tags origin "refs/heads/$POINTER_STAGE_BRANCH:refs/remotes/origin/$POINTER_STAGE_BRANCH"
            test "$(git rev-parse "refs/remotes/origin/$POINTER_STAGE_BRANCH")" = "$EXPECTED_MAIN_SHA"
            test "$(git rev-parse "$source_commit^")" = 936a31f703d31bd975af22d7349708d68a143d56
            test "$(jq -r .current.publication_commit state/live-set.json)" = "$release_commit"
            test "$(jq -r .current.source_commit state/live-set.json)" = "$source_commit"
            test "$(jq -r .current.release_id state/live-set.json)" = "$RELEASE_ID"
            mapfile -t changed < <(git diff --name-only "$release_commit" "$EXPECTED_MAIN_SHA" | sort)
            test "${#changed[@]}" = 2
            test "${changed[0]}" = releases/current-v3.json
            test "${changed[1]}" = state/live-set.json
          else
            echo "Malformed immutable promotion phase: release_dir=$(test -d "$RELEASE_ID" && echo yes || echo no), pointer=$pointer_release" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "current_commit=$EXPECTED_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\ncurrent=%s\nsource=%s\nrelease=%s\n' "$mode" "$EXPECTED_MAIN_SHA" "$source_commit" "$release_commit"

  verify_candidate:
    name: Deterministic compile, exhaustive closure and rendered sentinels
    needs: classify
    if: ${{ needs.classify.outputs.mode != 'pointer' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact phase commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.classify.outputs.current_commit }}
          fetch-depth: 4
          persist-credentials: false

      - name: Enforce sealed successor and predecessor boundaries
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CURRENT_COMMIT: ${{ needs.classify.outputs.current_commit }}
          SOURCE_COMMIT: ${{ needs.classify.outputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURRENT_COMMIT"
          git fetch --no-tags --depth=4 origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$CURRENT_COMMIT"
          for file in \
            contracts/202608291430-atlas-v9-live-release.json \
            compiler/202608291430-compile-atlas-v9-live.py \
            atman/202608291430-verify-live-release.mjs \
            atman/202608291430-compare-repd-coverage.mjs \
            atman/202608291430-rendered-browser-audit.mjs \
            atman/202608291430-public-browser-readback.mjs \
            ui/successor-202608291430/assets/repd-routing-client.mjs \
            ui/successor-202608291430/index.html; do test -f "$file"; done
          test "$(sha256sum index.html | cut -d' ' -f1)" = 4d059a6963ee73378b21bf378a3590292bbced0bba6f3cacf4acd9c6bc695533
          cmp state/live-set.json releases/current-v3.json
          test "$(jq -r .current.release_id state/live-set.json)" = "$PREDECESSOR_RELEASE_ID"
          test "$(jq -r .current.publication_commit state/live-set.json)" = 1898184ccbf52ca836cf1482362fc5933baf3e8d
          ! rg -n '__ROUTING_RELEASE_|__RELEASE_COMMIT_|__SOURCE_COMMIT_' contracts/202608291430-atlas-v9-live-release.json
          test "$(jq -r .source_parent_commit contracts/202608291430-atlas-v9-live-release.json)" = 936a31f703d31bd975af22d7349708d68a143d56
          test "$(jq -r .repd_routing.publication_commit contracts/202608291430-atlas-v9-live-release.json)" = "$ROUTING_PUBLICATION_COMMIT"
          test "$(jq -r .repd_routing.source_commit contracts/202608291430-atlas-v9-live-release.json)" = 0d3af65d69592340d14acf5be2af5ead123f324a
          test "$(jq -r .repd_routing.projects_sha256 contracts/202608291430-atlas-v9-live-release.json)" = c06aedef176d2d38fd135806306a8ef81b4af9994c7be31e8bd760304149f862
          test "$(jq -r .repd.selectable_rows contracts/202608291430-atlas-v9-live-release.json)" = 11033
          test "$(jq -r .repd.excluded_false_origin_rows contracts/202608291430-atlas-v9-live-release.json)" = 36
          test "$(jq -r .repd_routing.normal_plus_fallback_union contracts/202608291430-atlas-v9-live-release.json)" = 13452
          test "$(jq -r .repd_routing.normal_plus_fallback_union_set_sha256 contracts/202608291430-atlas-v9-live-release.json)" = 1ed30d2eef18b75d4b4064f971d2b1ea3fd41ef618fc585b3a3ff0723462ac5f
          if test "$MODE" = source; then
            test "$CURRENT_COMMIT" = "$SOURCE_COMMIT"
            test ! -e "$RELEASE_ID"
          else
            test "$CURRENT_COMMIT" != "$SOURCE_COMMIT"
            test -f "$RELEASE_ID/index.html"
          fi

      - name: Configure exact Python and Node
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Configure exact Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Fetch and bind the exact public routing and data dependencies
        run: |
          set -euo pipefail
          mkdir -p work/routing/public work/routing/raw "work/data-release/$DATA_RELEASE_ID"
          for relative in release.json projects.json index.html; do
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 \
              --header 'Accept-Encoding: identity' --header 'Origin: https://ventusltd.github.io' \
              --dump-header "work/routing/public/$relative.headers" \
              "$ROUTING_BASE_URL$relative" -o "work/routing/public/$relative"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 \
              "https://raw.githubusercontent.com/Ventusltd/data-gridatlas/$ROUTING_PUBLICATION_COMMIT/$ROUTING_RELEASE_ID/$relative" \
              -o "work/routing/raw/$relative"
            cmp "work/routing/public/$relative" "work/routing/raw/$relative"
          done
          test "$(wc -c < work/routing/public/projects.json)" = 979338
          test "$(sha256sum work/routing/public/projects.json | cut -d' ' -f1)" = c06aedef176d2d38fd135806306a8ef81b4af9994c7be31e8bd760304149f862
          test "$(sha256sum work/routing/public/release.json | cut -d' ' -f1)" = 7b6936713e83afc52b9a897eb33cbeffc36d2e0fbf9a40fe782d05f6c7943704
          test "$(sha256sum work/routing/public/index.html | cut -d' ' -f1)" = 2623b9a6b4033cee8a95d582e9f1f709367b9773756a8d9874dbcb2f395a6eaa
          for relative in release.json projects.json; do
            tr -d '\r' < "work/routing/public/$relative.headers" | grep -Eiq '^access-control-allow-origin: \*$'
            ! tr -d '\r' < "work/routing/public/$relative.headers" | grep -Eiq '^content-encoding:'
          done
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 "$DATA_BASE_URL/release.json" -o "work/data-release/$DATA_RELEASE_ID/release.json"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 "$DATA_BASE_URL/browser-layer-registry.json" -o "work/data-release/$DATA_RELEASE_ID/browser-layer-registry.json"
          test "$(sha256sum "work/data-release/$DATA_RELEASE_ID/release.json" | cut -d' ' -f1)" = 19684ac3e86fac4346fab121a948bab0aa857108564fec5be242484d2baefd06
          test "$(sha256sum "work/data-release/$DATA_RELEASE_ID/browser-layer-registry.json" | cut -d' ' -f1)" = 9b2169bcfd47bf51f0aaf8350487de19578e32358e191b961385a149a4637e1b

      - name: Verify dependency receipts, closures and public range support
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          contract = json.loads(pathlib.Path('contracts/202608291430-atlas-v9-live-release.json').read_text())
          routing = json.loads(pathlib.Path('work/routing/public/release.json').read_text())
          assert routing['schema'] == 'data-gridatlas.repd-routing-release.v1'
          assert routing['release_id'] == contract['repd_routing']['release_id']
          assert routing['source_commit'] == contract['repd_routing']['source_commit']
          assert routing['classification'] == 'IMMUTABLE_REPD_ROUTING_RELEASE' and routing['immutable'] is True
          assert routing['public_url'] == contract['repd_routing']['base_url']
          assert {key: routing['coverage'][key] for key in ('projects','unique_numeric_repd_refs','map_identities','no_map_identities','map_set_sha256','no_map_set_sha256')} == {
              'projects': 7680, 'unique_numeric_repd_refs': 7680, 'map_identities': 7652, 'no_map_identities': 28,
              'map_set_sha256': '4199f74165ed049c382ae322c5b5577a06a01c72dde0df9711a0bc368a918834',
              'no_map_set_sha256': '4e172523b8b352c73f98e7533cbb814559dd5d1dd9c2c04d1ee3904df26303e6'}
          assert routing['files']['projects'] == {'path':'projects.json','bytes':979338,'sha256':'c06aedef176d2d38fd135806306a8ef81b4af9994c7be31e8bd760304149f862'}
          data = json.loads(pathlib.Path('work/data-release/202608291237-data-gridatlas/release.json').read_text())
          registry = json.loads(pathlib.Path('work/data-release/202608291237-data-gridatlas/browser-layer-registry.json').read_text())
          assert data['classification'] == 'LIVE_IMMUTABLE_DATA_RELEASE' and data['immutable'] is True and data['v8_untouched'] is True
          assert {key:data['candidate_closure'][key] for key in ('features','layer_membership_rows','layers','sources')} == {'features':541282,'layer_membership_rows':526388,'layers':60,'sources':56}
          assert registry['load_policy'] == {'default_visible_layers': [], 'fetch_on_user_enable_only': True, 'initial_fetches': 0}
          layers = [layer for group in registry['groups'] for layer in group['layers']]
          assert len(layers) == len({layer['id'] for layer in layers}) == 60
          assert all(layer['available'] and layer['publishable'] and layer['enabled'] for layer in layers)
          assert all(not layer['default_visible'] and not layer['preload'] for layer in layers)
          assert sum(layer['v9_data']['disposition'].startswith('QUARANTINED_') for layer in layers) == 5
          PY
          range_url="${DATA_BASE_URL}data/derived/grid_400kv_snapped.parquet"
          status="$(curl --silent --show-error --location --max-time 90 --range 0-1023 --header 'Accept-Encoding: identity' --header 'Origin: https://ventusltd.github.io' --dump-header work/data-range.headers --output work/data-range.bin --write-out '%{http_code}' "$range_url")"
          test "$status" = 206
          test "$(wc -c < work/data-range.bin)" = 1024
          tr -d '\r' < work/data-range.headers | grep -Eiq '^access-control-allow-origin: \*$'
          tr -d '\r' < work/data-range.headers | grep -Eiq '^accept-ranges: bytes$'
          tr -d '\r' < work/data-range.headers | grep -Eiq '^content-range: bytes 0-1023/[0-9]+$'
          ! tr -d '\r' < work/data-range.headers | grep -Eiq '^content-encoding:'

      - name: Deterministic clean A/B compile and checked-in comparison
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          SOURCE_COMMIT: ${{ needs.classify.outputs.source_commit }}
        run: |
          set -euo pipefail
          committed_at="$(git show -s --format=%cI "$SOURCE_COMMIT")"
          for build in a b; do
            mkdir -p "work/build-$build"
            python -B compiler/202608291430-compile-atlas-v9-live.py \
              --repository . \
              --output "work/build-$build/$RELEASE_ID" \
              --source-commit "$SOURCE_COMMIT" \
              --source-committed-at "$committed_at"
            (cd "work/build-$build" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "work/build-$build.sha256"
          done
          diff --unified work/build-a.sha256 work/build-b.sha256 | tee work/build-ab.diff
          if test "$MODE" = release; then diff --recursive --no-dereference "work/build-a/$RELEASE_ID" "$RELEASE_ID"; fi

      - name: Verify exact identities, exhaustive coverage and deterministic outputs
        run: |
          set -euo pipefail
          node atman/202608291430-verify-live-release.mjs \
            --root . \
            --release-directory "work/build-a/$RELEASE_ID" \
            --routing-projects work/routing/public/projects.json \
            --data-release "work/data-release/$DATA_RELEASE_ID" \
            > work/atman-live-release.json
          node atman/202608291430-compare-repd-coverage.mjs \
            --repository . \
            --build-a "work/build-a/$RELEASE_ID" \
            --build-b "work/build-b/$RELEASE_ID" \
            --routing-projects work/routing/public/projects.json \
            --output work/exhaustive-coverage.json
          test "$(jq -r .classification work/atman-live-release.json)" = VERIFIED_LIVE_ROUTING_RELEASE_SOURCE
          test "$(jq -r .normal_registry.selectable_rows work/atman-live-release.json)" = 11033
          test "$(jq -r .normal_registry.excluded_false_origin_rows work/atman-live-release.json)" = 36
          test "$(jq -r .classification work/exhaustive-coverage.json)" = VERIFIED_EXHAUSTIVE_REPD_ROUTING_COVERAGE
          test "$(jq -r .promotion_eligible work/exhaustive-coverage.json)" = true
          test "$(jq -r .routing.routing_only_map_fallbacks work/exhaustive-coverage.json)" = 2419
          test "$(jq -r .routing.normal_plus_fallback_union work/exhaustive-coverage.json)" = 13452
          test "$(jq -r .routing.missing_map_identities work/exhaustive-coverage.json)" = 0
          test "$(jq -r .routing.no_map_selectable_intersection work/exhaustive-coverage.json)" = 0

      - name: Install locked rendered-browser harness
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Render zero-fetch base and all exact deep-link sentinels
        id: rendered
        continue-on-error: true
        run: |
          node atman/202608291430-rendered-browser-audit.mjs \
            . \
            "work/build-a/$RELEASE_ID" \
            "work/data-release/$DATA_RELEASE_ID" \
            work/routing/public/projects.json \
            work/rendered

      - name: Enforce rendered browser proof
        if: always()
        env:
          RENDERED_OUTCOME: ${{ steps.rendered.outcome }}
        run: |
          set -euo pipefail
          test "$RENDERED_OUTCOME" = success
          proof=work/rendered/202608291430-browser-audit.json
          test "$(jq -r .classification "$proof")" = VERIFIED_RENDERED_ROUTING_BROWSER
          test "$(jq -r .failed "$proof")" = 0
          test "$(jq -r .normal_registry_selectable_rows "$proof")" = 11033
          test "$(jq -r .excluded_false_origin_rows "$proof")" = 36
          test "$(jq -r .routing_without_deep_link_requests "$proof")" = 0
          test "$(jq -r .initial_v8_parquet_requests "$proof")" = 0
          test "$(jq -r .layer_controls "$proof")" = 60
          test "$(jq -r '.sentinels["12780"].selectable' "$proof")" = false
          test "$(jq -r '.sentinels["13429"].selectable' "$proof")" = false
          test "$(jq -r '.sentinels["2535"].selectable' "$proof")" = true

      - name: Assemble accepted immutable release and proof
        if: success()
        run: |
          set -euo pipefail
          mkdir -p work/accepted-bundle/release work/accepted-bundle/proof
          cp -a "work/build-a/$RELEASE_ID/." work/accepted-bundle/release/
          cp work/build-a.sha256 work/build-b.sha256 work/build-ab.diff work/accepted-bundle/proof/
          cp work/atman-live-release.json work/exhaustive-coverage.json work/data-range.headers work/data-range.bin work/accepted-bundle/proof/
          cp work/rendered/202608291430-browser-audit.json work/accepted-bundle/proof/
          cp work/rendered/202608291430-browser-desktop.png work/rendered/202608291430-browser-mobile.png work/accepted-bundle/proof/
          cp work/routing/public/release.json work/routing/public/projects.json work/routing/public/index.html work/accepted-bundle/proof/
          test "$(find work/accepted-bundle/release -type f | wc -l)" = 8

      - name: Upload accepted build and proof
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atlas-v9-${{ needs.classify.outputs.current_commit }}-${{ github.run_id }}-${{ github.run_attempt }}-accepted
          path: work/accepted-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  stage_release:
    name: Stage the immutable timestamp-folder child for App promotion
    needs: [classify, verify_candidate]
    if: ${{ needs.classify.outputs.mode == 'source' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact source with staging credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.classify.outputs.source_commit }}
          fetch-depth: 4

      - name: Download accepted release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: atlas-v9-${{ needs.classify.outputs.current_commit }}-${{ github.run_id }}-${{ github.run_attempt }}-accepted
          path: work/accepted

      - name: CAS-stage only the immutable release child
        env:
          SOURCE_COMMIT: ${{ needs.classify.outputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=4 origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          test ! -e "$RELEASE_ID"
          test "$(jq -r .classification work/accepted/proof/exhaustive-coverage.json)" = VERIFIED_EXHAUSTIVE_REPD_ROUTING_COVERAGE
          test "$(jq -r .promotion_eligible work/accepted/proof/exhaustive-coverage.json)" = true

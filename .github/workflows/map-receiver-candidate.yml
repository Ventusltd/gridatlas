name: MAP receiver candidate browser acceptance
on:
  pull_request:
    paths:
      - 'atlas/cartridges/202611161645-*'
      - 'atlas/modules/202611161645-*'
      - 'atlas/manifests/202611161645-*'
      - 'atlas/v/202611161645/**'
      - 'tools/proofs/map-receiver-restoration.browser.mjs'
      - '.github/workflows/map-receiver-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-receiver-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/proofs/202611161645-sld-sandbox.proof.mjs
      - name: Real MAP clicks and visible calculation results
        run: node tools/proofs/map-receiver-restoration.browser.mjs
      - name: Stalled declared-connection lookup remains explicit
        env:
          NESO_TIMEOUT: '1'
          WIDTHS: '390'
          REFS: '12588'
        run: node tools/proofs/map-receiver-restoration.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-receiver-${{ github.event.pull_request.head.sha || github.sha }}
          path: work/map-*
          retention-days: 14

name: Satellite layout browser probe
on:
  push:
    branches: ['test/satellite-layout-202609110242']
    paths: ['.github/workflows/satellite-layout-probe.yml', 'atlas/testcode/202609110242/index.html', 'atlas/testcode/202609110242/browser-proof.py']
permissions:
  contents: read
concurrency:
  group: satellite-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser driver
        run: |
          python -m pip install playwright==1.55.0 requests
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Read-only browser regression checks
        env:
          PROBE_SHA: ${{ github.sha }}
        run: |
          mkdir -p evidence
          curl --fail --retry 2 --max-time 30 "https://raw.githubusercontent.com/Ventusltd/gridatlas/$PROBE_SHA/atlas/testcode/202609110242/browser-proof.py" -o /tmp/browser-proof.py
          python /tmp/browser-proof.py
      - name: Upload screenshots and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-browser-evidence
          path: evidence/
          retention-days: 7

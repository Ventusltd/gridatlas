name: Satellite layout browser probe
on:
  push:
    branches: ['test/satellite-layout-202609110242']
    paths: ['.github/workflows/satellite-layout-probe.yml', 'atlas/testcode/202609110242/index.html', 'atlas/testcode/202609110242/browser-proof.py']
permissions:
  contents: read
concurrency:
  group: satellite-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install browser driver
        run: |
          python -m pip install playwright==1.55.0 requests
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Verify exact published bytes
        run: |
          mkdir -p evidence
          python - <<'PY'
          import requests,hashlib,time,json,pathlib
          sha='19588c2dbae435c826e48d6cdd271c7fe64e0d54'
          raw='https://raw.githubusercontent.com/Ventusltd/gridatlas/'+sha+'/atlas/testcode/202609110242/'
          live='https://ventusltd.github.io/gridatlas/atlas/testcode/202609110242/'
          receipt={'published_commit':sha,'files':{}}
          for name in ['index.html','satellite.js','browser-proof.py']:
            r=requests.get(raw+name,timeout=30);r.raise_for_status();expected=r.content
            if name=='browser-proof.py':pathlib.Path('/tmp/browser-proof.py').write_bytes(expected)
            for attempt in range(18):
              got=requests.get(live+name+'?verify='+sha,timeout=20)
              if got.ok and got.content==expected:break
              time.sleep(5)
            assert got.ok and got.content==expected,'Served bytes do not match: '+name
            receipt['files'][name]={'sha256':hashlib.sha256(expected).hexdigest(),'bytes':len(expected),'http':got.status_code,'exact_match':True}
          current=requests.get('https://ventusltd.github.io/gridatlas/atlas/current.json',timeout=30);current.raise_for_status()
          receipt['production_generation']=current.json()['generation']
          assert receipt['production_generation']=='202609080850'
          pathlib.Path('evidence/served-byte-verification.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt))
          PY
      - name: Browser regression on actual published URL, no interception
        run: python /tmp/browser-proof.py
      - name: Upload screenshots and network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: satellite-browser-evidence
          path: evidence/
          retention-days: 7

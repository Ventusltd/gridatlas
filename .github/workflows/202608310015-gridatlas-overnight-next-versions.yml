name: 202608310015 GridAtlas overnight next versions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608310015-gridatlas-overnight-next-versions.yml
      - orchestration/202608310015-gridatlas-overnight-next-versions/**
  workflow_dispatch:

# The two schedules that stood here fired for the last time on 2026-08-31.
# Written without their YAML shape on purpose - see the note at the foot of
# this comment:
#
#     schedule   30,45 23 30 8 *
#     schedule   */15 0-7 31 8 *
#
# Both named one calendar day in August, so after that night they could not
# fire again until the same dates in 2027. That is the disease cvaa calls
# no-time-based-gates: automation that dies when the session that wrote it
# does. Measured on a clean clone at 8fb95a2, gridatlas carried three of them.
#
# They are removed rather than rewritten as a live schedule. This programme is
# genuinely over - its own config declares active_until 2026-08-31T08:00:00Z
# and its ledger's last corpus gate is 2026-08-31T03:46Z with the scope never
# reaching the 43,000 words it required - so a recurring cron would wake a
# controller that can only decline, on a branch two agents are cutting in, with
# contents: write in its hand. Nothing that works is lost: push and
# workflow_dispatch both remain, and this workflow still runs on them.
#
# A dead schedule is worse than no schedule, because it reads as automation
# that is running.
#
# The two above are written as `schedule  <fields>` rather than in YAML. The
# cvaa antibody for this vaccine scans the raw workflow text for
# `cron:` followed by a quoted string, with no notion of a YAML comment, so
# quoting a REMOVED cron verbatim leaves the finding standing. Measured: the
# schedules were gone from the parsed triggers - `schedule present: False` on
# both files - and the vaccine still reported all three. A tool that cannot
# tell a record from a trigger will be fought rather than followed, so the
# record is kept and the shape is not.

permissions:
  actions: write
  contents: write
  pages: write

concurrency:
  group: 202608310015-gridatlas-overnight-next-versions
  cancel-in-progress: false

jobs:
  study-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PROGRAMME_ROOT: nightly/202608310015-gridatlas-overnight-next-versions
      PROGRAMME_CONFIG: orchestration/202608310015-gridatlas-overnight-next-versions/202608310015-programme.json
      ASSEMBLER: orchestration/202608310015-gridatlas-overnight-next-versions/202608310015-assemble-study-build-controller.mjs
      CONTROLLER: work/202608310015-study-build-controller.mjs
      VERIFIER: orchestration/202608310015-gridatlas-overnight-next-versions/202608310015-verify-overnight-candidate.mjs
      FINALISER: orchestration/202608310015-gridatlas-overnight-next-versions/202608310015-finalise-overnight-candidate.mjs
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fetch every newly updated artifact branch
        run: git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Validate the timestamped controller
        run: |
          node --version
          node --check "$ASSEMBLER"
          SOURCE_ROOT="$GITHUB_WORKSPACE" CONTROLLER_OUTPUT="$GITHUB_WORKSPACE/$CONTROLLER" node "$ASSEMBLER"
          node --check "$CONTROLLER"
          node --check "$VERIFIER"
          node --check "$FINALISER"
          node -e "const p=require('./${PROGRAMME_CONFIG}'); if(p.generation!=='202608310015'||p.minimum_study_seconds<3600||p.expected_scope_words<43000) process.exit(1)"

      - name: Record study and build only after the one-hour gate
        id: controller
        env:
          SOURCE_ROOT: ${{ github.workspace }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: node "$CONTROLLER"

      - name: Require the complete 43k scope before any candidate
        id: corpus_gate
        env:
          CONTROLLER_CANDIDATE_CREATED: ${{ steps.controller.outputs.candidate_created }}
          CANDIDATE_DIR: ${{ steps.controller.outputs.candidate_dir }}
          CANDIDATE_ID: ${{ steps.controller.outputs.candidate_id }}
          SOURCE_FINGERPRINT: ${{ steps.controller.outputs.source_fingerprint }}
          VISIBLE_WORDS: ${{ steps.controller.outputs.visible_unique_words }}
        run: |
          REQUIRED_WORDS=$(node -p "require('./${PROGRAMME_CONFIG}').expected_scope_words")
          VISIBLE_WORDS=${VISIBLE_WORDS:-0}
          echo "required_words=$REQUIRED_WORDS" >> "$GITHUB_OUTPUT"
          echo "visible_words=$VISIBLE_WORDS" >> "$GITHUB_OUTPUT"

          export REQUIRED_WORDS VISIBLE_WORDS
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          ledger_path = Path(os.environ['PROGRAMME_ROOT']) / '202608310015-gridatlas-programme-ledger.json'
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          candidate_id = os.environ.get('CANDIDATE_ID', '')
          visible_words = int(os.environ.get('VISIBLE_WORDS', '0'))
          required_words = int(os.environ.get('REQUIRED_WORDS', '43000'))
          created = os.environ.get('CONTROLLER_CANDIDATE_CREATED', '').lower() == 'true'
          removed = []

          if created and visible_words < required_words:
              removed = [row for row in ledger.get('candidates', []) if row.get('candidate_id') == candidate_id]
              ledger['candidates'] = [row for row in ledger.get('candidates', []) if row.get('candidate_id') != candidate_id]
              if removed:
                  first_sequence = min(int(row.get('sequence', ledger.get('next_candidate_sequence', 1))) for row in removed)
                  ledger['next_candidate_sequence'] = min(int(ledger.get('next_candidate_sequence', first_sequence)), first_sequence)

          ledger['last_corpus_gate'] = {
              'checked_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'source_fingerprint': os.environ.get('SOURCE_FINGERPRINT', ''),
              'visible_unique_words': visible_words,
              'required_unique_words': required_words,
              'scope_ready': visible_words >= required_words,
              'candidate_suppressed': bool(removed),
              'candidate_id': candidate_id or None
          }
          ledger_path.write_text(json.dumps(ledger, indent=2) + '\n', encoding='utf-8')
          PY

          if [ "$VISIBLE_WORDS" -lt "$REQUIRED_WORDS" ]; then
            if [ "${CONTROLLER_CANDIDATE_CREATED:-false}" = "true" ] && [ -n "${CANDIDATE_DIR:-}" ]; then
              rm -rf -- "$CANDIDATE_DIR"
            fi
            echo "candidate_allowed=false" >> "$GITHUB_OUTPUT"
            echo "scope_ready=false" >> "$GITHUB_OUTPUT"
            echo "gate_status=WAITING_FOR_COMPLETE_43K_SCOPE" >> "$GITHUB_OUTPUT"
          elif [ "${CONTROLLER_CANDIDATE_CREATED:-false}" = "true" ]; then
            echo "candidate_allowed=true" >> "$GITHUB_OUTPUT"
            echo "scope_ready=true" >> "$GITHUB_OUTPUT"
            echo "gate_status=COMPLETE_SCOPE_CANDIDATE_ALLOWED" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_allowed=false" >> "$GITHUB_OUTPUT"
            echo "scope_ready=true" >> "$GITHUB_OUTPUT"
            echo "gate_status=COMPLETE_SCOPE_STUDYING" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned browser tooling for a new candidate only
        if: steps.corpus_gate.outputs.candidate_allowed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser acceptance against the isolated candidate
        id: browser
        if: steps.corpus_gate.outputs.candidate_allowed == 'true'
        env:
          CANDIDATE_DIR: ${{ steps.controller.outputs.candidate_dir }}
          CANDIDATE_GENERATION: ${{ steps.controller.outputs.candidate_generation }}
          SEARCH_GENERATION: ${{ steps.controller.outputs.search_generation }}
          RUN_STAMP: ${{ steps.controller.outputs.run_stamp }}
        run: |
          set -u
          SERVE_ROOT="$RUNNER_TEMP/202608310015-gridatlas-serve"
          rm -rf "$SERVE_ROOT"
          mkdir -p "$SERVE_ROOT"
          ln -s "$GITHUB_WORKSPACE" "$SERVE_ROOT/gridatlas"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$SERVE_ROOT" >"$RUNNER_TEMP/202608310015-gridatlas-server.log" 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:4173/gridatlas/${CANDIDATE_DIR}/current.json" >/dev/null; then break; fi
            sleep 1
          done
          PROOF="${CANDIDATE_DIR}/${RUN_STAMP}-gridatlas-browser-proof.json"
          SCREENSHOT="${CANDIDATE_DIR}/${RUN_STAMP}-gridatlas-browser-proof.png"
          set +e
          GRIDATLAS_URL="http://127.0.0.1:4173/gridatlas/${CANDIDATE_DIR}/" \
          EXPECTED_GENERATION="$CANDIDATE_GENERATION" \
          EXPECTED_SEARCH_GENERATION="$SEARCH_GENERATION" \
          OUTPUT="$PROOF" \
          SCREENSHOT="$SCREENSHOT" \
          node "$VERIFIER"
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"
          echo "screenshot=$SCREENSHOT" >> "$GITHUB_OUTPUT"

      - name: Finalise candidate status and quarantine evidence
        id: finaliser
        if: steps.corpus_gate.outputs.candidate_allowed == 'true'
        env:
          SOURCE_ROOT: ${{ github.workspace }}
          CANDIDATE_DIR: ${{ steps.controller.outputs.candidate_dir }}
          CANDIDATE_ID: ${{ steps.controller.outputs.candidate_id }}
          CANDIDATE_MANIFEST: ${{ steps.controller.outputs.candidate_manifest }}
          CANDIDATE_CURRENT: ${{ steps.controller.outputs.candidate_current }}
          PROOF: ${{ steps.browser.outputs.proof }}
          BROWSER_EXIT: ${{ steps.browser.outputs.exit_code }}
          RUN_STAMP: ${{ steps.controller.outputs.run_stamp }}
        run: node "$FINALISER"

      - name: Commit only new timestamped programme and candidate folders
        id: commit
        if: steps.controller.outputs.active == 'true'
        env:
          RUN_STAMP: ${{ steps.controller.outputs.run_stamp }}
          CANDIDATE_CREATED: ${{ steps.corpus_gate.outputs.candidate_allowed }}
          CANDIDATE_DIR: ${{ steps.controller.outputs.candidate_dir }}
        run: |
          git config user.name "gridatlas-overnight-next-versions"
          git config user.email "actions@users.noreply.github.com"
          git add -- "$PROGRAMME_ROOT"
          if [ "$CANDIDATE_CREATED" = "true" ]; then git add -- "$CANDIDATE_DIR"; fi
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CANDIDATE_CREATED" = "true" ]; then
            MESSAGE="${RUN_STAMP}-gridatlas: publish isolated overnight candidate and proof"
          else
            MESSAGE="${RUN_STAMP}-gridatlas: record overnight study observation"
          fi
          git commit -m "$MESSAGE"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            sleep $((attempt * 3))
          done
          echo "Failed to push additive overnight output after three rebases" >&2
          exit 1

      - name: Request Pages rebuild for public testing
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Publish run summary
        if: always()
        env:
          ACTIVE: ${{ steps.controller.outputs.active }}
          RUN_STAMP: ${{ steps.controller.outputs.run_stamp }}
          WORDS: ${{ steps.controller.outputs.visible_unique_words }}
          REQUIRED_WORDS: ${{ steps.corpus_gate.outputs.required_words }}
          SCOPE_READY: ${{ steps.corpus_gate.outputs.scope_ready }}
          CORPUS_GATE: ${{ steps.corpus_gate.outputs.gate_status }}
          STUDY_MATURE: ${{ steps.controller.outputs.study_mature }}
          REMAINING: ${{ steps.controller.outputs.study_remaining_seconds }}
          STUDY_FOLDER: ${{ steps.controller.outputs.study_folder }}
          CANDIDATE_CREATED: ${{ steps.corpus_gate.outputs.candidate_allowed }}
          CANDIDATE_DIR: ${{ steps.controller.outputs.candidate_dir }}
          CANDIDATE_VERSION: ${{ steps.controller.outputs.candidate_version }}
          CANDIDATE_STATUS: ${{ steps.finaliser.outputs.candidate_status }}
        run: |
          {
            echo "# 202608310015 GridAtlas overnight controller"
            echo
            echo "- Active: ${ACTIVE:-false}"
            echo "- Run generation: ${RUN_STAMP:-none}"
            echo "- Visible corpus words: ${WORDS:-0} / ${REQUIRED_WORDS:-43000}"
            echo "- Complete scope visible: ${SCOPE_READY:-false}"
            echo "- Corpus gate: ${CORPUS_GATE:-unknown}"
            echo "- Study mature: ${STUDY_MATURE:-false}"
            echo "- Study seconds remaining: ${REMAINING:-unknown}"
            echo "- Study evidence: \`${STUDY_FOLDER:-none}\`"
            echo "- Candidate created: ${CANDIDATE_CREATED:-false}"
            if [ "${CANDIDATE_CREATED:-false}" = "true" ]; then
              OWNER_LOWER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
              REPO_NAME=${GITHUB_REPOSITORY#*/}
              echo "- Candidate version: ${CANDIDATE_VERSION}"
              echo "- Candidate status: ${CANDIDATE_STATUS:-UNKNOWN}"
              echo "- Candidate URL: https://${OWNER_LOWER}.github.io/${REPO_NAME}/${CANDIDATE_DIR}/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep quarantined candidates visible but mark the run red
        if: steps.corpus_gate.outputs.candidate_allowed == 'true' && steps.finaliser.outputs.candidate_status == 'FAIL'
        run: |
          echo "Candidate was committed with quarantine evidence; no live pointer was changed." >&2
          exit 1

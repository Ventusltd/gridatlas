name: 202608300442 Repair five-hour comparator parent URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300442-repair-five-hour-comparator-parent.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gridatlas-five-hour-parent-repair
  cancel-in-progress: false

env:
  TARGET: .github/workflows/202608300437-five-hour-v8-v9-watchdog.yml

jobs:
  repair:
    name: Supply the immutable parent URL required by Atman
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact repair boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 120
          persist-credentials: true

      - name: Apply one bounded comparator repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/202608300437-five-hour-v8-v9-watchdog.yml')
          text = path.read_text(encoding='utf-8')
          parent = '  PARENT_URL: https://ventusltd.github.io/gridatlas/202608292126-atlas-v9/\n'
          if parent not in text:
              anchor = '  ORACLE_URL: https://globalgrid2050.com/repd_grid_atlasv8/\n'
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected comparator ORACLE_URL anchor')
              text = text.replace(anchor, anchor + parent, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          grep -q '^  PARENT_URL: https://ventusltd.github.io/gridatlas/202608292126-atlas-v9/$' "$TARGET"
          grep -q '^          CANDIDATE_URL:' "$TARGET"
          grep -q '^  ORACLE_URL:' "$TARGET"
          git diff --check

      - name: Compare-and-swap repaired conductor onto main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          if git diff --quiet -- "$TARGET"; then
            echo 'Comparator already carries the immutable parent URL.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git add "$TARGET"
          git config user.name gridatlas-five-hour-repair-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608300442: supply Atman parent URL'
          git push origin HEAD:main

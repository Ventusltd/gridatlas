name: 202608291742 Promote verified V9 to root
run-name: Promote verified V9 root from closure ${{ github.event.workflow_run.id || github.run_id }}

on:
  workflow_run:
    workflows: ["202608291742 V9 transfer closure gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: gridatlas-v9-root-promotion
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  promote:
    name: Compare-and-swap root to verified immutable V9
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout current main with bounded write credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Bind promotion to the exact green closure commit
        id: bind
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          CURRENT_HEAD="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$CURRENT_HEAD"
          if test "${{ github.event_name }}" = "workflow_run"; then
            test "$TRIGGER_SHA" = "$CURRENT_HEAD"
          fi

          cmp state/live-set.json releases/current-v3.json
          jq -e '
            .classification == "VERIFIED_LIVE_ATLAS_V9" and
            .verification.promotion_eligible == true and
            .verification.rendered_all_sentinels == true and
            .verification.real_duckdb_wasm == true and
            .verification.real_parquet_range_206 == true
          ' state/live-set.json >/dev/null

          RELEASE_ID="$(jq -r .current.release_id state/live-set.json)"
          LIVE_URL="$(jq -r .current.live_url state/live-set.json)"
          [[ "$RELEASE_ID" =~ ^[0-9]{12}-atlas-v9$ ]]
          test "$LIVE_URL" = "https://ventusltd.github.io/gridatlas/$RELEASE_ID/"
          test -f "$RELEASE_ID/release-manifest.json"
          test -f "$RELEASE_ID/build-manifest.json"
          test "$(sha256sum "$RELEASE_ID/release-manifest.json" | cut -d' ' -f1)" = \
            "$(jq -r .current.release_manifest_sha256 state/live-set.json)"
          test "$(sha256sum "$RELEASE_ID/build-manifest.json" | cut -d' ' -f1)" = \
            "$(jq -r .current.build_manifest_sha256 state/live-set.json)"

          mkdir -p work/preflight
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$LIVE_URL/release-manifest.json" \
            -o work/preflight/release-manifest.json
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --max-time 90 \
            --header 'Accept-Encoding: identity' "$LIVE_URL/index.html" \
            -o work/preflight/index.html
          cmp "$RELEASE_ID/release-manifest.json" work/preflight/release-manifest.json
          cmp "$RELEASE_ID/index.html" work/preflight/index.html

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "live_url=$LIVE_URL" >> "$GITHUB_OUTPUT"
          echo "bound_head=$CURRENT_HEAD" >> "$GITHUB_OUTPUT"

      - name: Render the stable root as a query-preserving pointer
        id: render
        shell: bash
        env:
          RELEASE_ID: ${{ steps.bind.outputs.release_id }}
          LIVE_URL: ${{ steps.bind.outputs.live_url }}
        run: |
          set -euo pipefail
          TARGET="./$RELEASE_ID/"
          cat > work/index.next.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="description" content="Grid Atlas V9 current verified release pointer.">
            <meta name="gridatlas-current-release" content="$RELEASE_ID">
            <title>Grid Atlas V9 · Current verified release</title>
            <link rel="canonical" href="$LIVE_URL">
            <script>
              (() => {
                const target = "$TARGET";
                window.location.replace(target + window.location.search + window.location.hash);
              })();
            </script>
            <noscript><meta http-equiv="refresh" content="0; url=$TARGET"></noscript>
          </head>
          <body data-gridatlas-current-release="$RELEASE_ID">
            <main>
              <h1>Grid Atlas V9</h1>
              <p>Opening the current verified immutable release.</p>
              <p><a href="$TARGET">Open $RELEASE_ID</a></p>
            </main>
          </body>
          </html>
          EOF

          grep -F 'window.location.search + window.location.hash' work/index.next.html >/dev/null
          grep -F "data-gridatlas-current-release=\"$RELEASE_ID\"" work/index.next.html >/dev/null
          grep -F "href=\"$TARGET\"" work/index.next.html >/dev/null

          if cmp -s index.html work/index.next.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare-and-swap the root pointer on main
        if: ${{ steps.render.outputs.changed == 'true' }}
        id: commit
        shell: bash
        env:
          BOUND_HEAD: ${{ steps.bind.outputs.bound_head }}
          RELEASE_ID: ${{ steps.bind.outputs.release_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BOUND_HEAD"
          test "$(git rev-parse HEAD)" = "$BOUND_HEAD"

          cp work/index.next.html index.html
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"

          git config user.name "gridatlas-v9-root-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "202608291742: point Grid Atlas root at verified current V9"
          PROMOTION_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "promotion_commit=$PROMOTION_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Resolve commit to verify
        id: result
        shell: bash
        env:
          CHANGED: ${{ steps.render.outputs.changed }}
          NEW_COMMIT: ${{ steps.commit.outputs.promotion_commit }}
          BOUND_HEAD: ${{ steps.bind.outputs.bound_head }}
        run: |
          set -euo pipefail
          if test "$CHANGED" = "true"; then
            test -n "$NEW_COMMIT"
            echo "commit=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$BOUND_HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Pages deployment and root readback
        shell: bash
        env:
          RELEASE_ID: ${{ steps.bind.outputs.release_id }}
          VERIFY_COMMIT: ${{ steps.result.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pages_seen=false
          root_seen=false

          for attempt in $(seq 1 120); do
            runs="$(curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/actions/runs?head_sha=$VERIFY_COMMIT&per_page=100")"

            page_state="$(printf '%s' "$runs" | jq -r '
              [.workflow_runs[]
               | select(.name == "pages build and deployment")
               | {status, conclusion, id, html_url}]
              | first // empty
            ')"

            if test -n "$page_state"; then
              status="$(printf '%s' "$page_state" | jq -r .status)"
              conclusion="$(printf '%s' "$page_state" | jq -r .conclusion)"
              if test "$status" = completed && test "$conclusion" = success; then
                pages_seen=true
              elif test "$status" = completed && test "$conclusion" != success; then
                echo "Pages failed for $VERIFY_COMMIT: $page_state" >&2
                exit 1
              fi
            fi

            if curl --fail --silent --show-error --location --retry 2 --retry-all-errors \
              --header 'Accept-Encoding: identity' \
              "https://ventusltd.github.io/gridatlas/?_verify=$VERIFY_COMMIT" \
              -o work/root-public.html; then
              if grep -F "data-gridatlas-current-release=\"$RELEASE_ID\"" work/root-public.html >/dev/null &&
                 grep -F 'window.location.search + window.location.hash' work/root-public.html >/dev/null; then
                root_seen=true
              fi
            fi

            if test "$pages_seen" = true && test "$root_seen" = true; then
              break
            fi
            sleep 5
          done

          test "$pages_seen" = true
          test "$root_seen" = true
          test "$(sha256sum work/root-public.html | cut -d' ' -f1)" = \
            "$(sha256sum work/index.next.html | cut -d' ' -f1)"

          {
            echo "## Grid Atlas root promotion"
            echo
            echo "- Current immutable release: \`$RELEASE_ID\`"
            echo "- Root query/hash preservation: **verified**"
            echo "- GitHub Pages deployment: **verified**"
            echo "- Root/public byte identity: **verified**"
            echo "- Promotion commit: \`$VERIFY_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Satellite dock browser proof
on:
  push:
    branches: ['test/satellite-dock-202609110849']
    paths:
      - '.github/workflows/satellite-dock-202609110849.yml'
      - 'atlas/testcode/202609110849/build.py'
      - 'atlas/testcode/202609110849/dock-ui.js'
      - 'atlas/testcode/202609110849/browser-proof.py'
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/satellite-dock-202609110849
          fetch-depth: 2
          sparse-checkout: |
            atlas/testcode/202609110242
            atlas/testcode/202609110849
            tools/scope
            scope of works
      - name: Inspect and build isolated test files
        run: |
          git status --short --branch
          git log -2 --oneline
          cat AGENTS.md STATE.md
          python -c 'import json; print(json.load(open("atlas/current.json"))["generation"])'
          python atlas/testcode/202609110849/build.py
          node --check atlas/testcode/202609110849/satellite.js
          git diff --exit-code -- atlas/current.json STATE.md atlas/index.html
          mkdir -p evidence
          node tools/scope/loop.mjs lint > evidence/scope-lint.log 2>&1 || echo 'See scope-lint.log for sparse-checkout limitations'
          node tools/scope/loop.mjs state --stdout > evidence/state-check.md 2> evidence/state-error.log || true
          cmp STATE.md evidence/state-check.md && echo 'STATE parity PASS' || echo 'STATE parity not established; production STATE is unchanged'
      - name: Install browser driver
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Browser layout and live imagery
        env:
          PUBLISHED: 'false'
        run: python atlas/testcode/202609110849/browser-proof.py
      - name: Keep generated files on isolated test branch
        if: always()
        run: |
          test -f atlas/testcode/202609110849/satellite.js || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- atlas/testcode/202609110849/index.html atlas/testcode/202609110849/satellite.js atlas/testcode/202609110849/manifest.json
          if ! git diff --cached --quiet; then git commit -m 'build(test): generated isolated draggable satellite dock'; git push origin HEAD:test/satellite-dock-202609110849; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: satellite-dock-browser-evidence
          path: evidence/
          retention-days: 7

name: 202608292126 Bootstrap map-ready source programme
run-name: Install map-ready source programme ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608292126-bootstrap-map-ready-source.yml'
      - 'bootstrap/202608292126/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gridatlas-202608292126-bootstrap-source
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  install_source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Decode, validate and compare-and-swap non-workflow source programme
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

          test "$(find bootstrap/202608292126 -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" = 7
          test "$(git hash-object bootstrap/202608292126/part-00.b64)" = b283191e0046055a8c374fd4c3eb85c0c8e647bb
          test "$(git hash-object bootstrap/202608292126/part-01.b64)" = 0e5cb0bf4d078d53212bf3c1b18a56fb01098151
          test "$(git hash-object bootstrap/202608292126/part-02.b64)" = a84f050c1daf1b15884205886e67fb758b318997
          test "$(git hash-object bootstrap/202608292126/part-03.b64)" = 48711c873af2336daa97e39bb3ca18a4c5b315bc
          test "$(git hash-object bootstrap/202608292126/part-04a.b64)" = 689c50d3be400c8ea097f7fe5325649646cbd30d
          test "$(git hash-object bootstrap/202608292126/part-04b.b64)" = 91c475eb90b9cb36de0f1ceca8f648fdd5eb7248
          test "$(git hash-object bootstrap/202608292126/part-05.b64)" = 2c3becde3df55327abd9315a282f08c705e38c69

          cat bootstrap/202608292126/part-*.b64 > /tmp/gridatlas-map-ready-source.tar.gz.b64
          base64 --decode /tmp/gridatlas-map-ready-source.tar.gz.b64 > /tmp/gridatlas-map-ready-source.tar.gz
          test "$(sha256sum /tmp/gridatlas-map-ready-source.tar.gz | cut -d' ' -f1)" = 65158de561bcb0c086b53e862640641f0cbf8ee4e92aab47283e17b793437c91
          test "$(tar -tzf /tmp/gridatlas-map-ready-source.tar.gz | wc -l)" = 10
          tar -xzf /tmp/gridatlas-map-ready-source.tar.gz -C .

          # The archive also carries proposed workflow changes. GitHub Actions tokens
          # cannot create or alter workflow files, so restore them exactly and install
          # only the executable source programme. Workflow installation is performed
          # separately through the connected GitHub control plane.
          git restore --source=HEAD --staged --worktree .github/workflows

          python -m py_compile compiler/202608292126-build-map-ready-v9.py
          node --check atman/202608292126-layer-performance-comparator.mjs
          node --check ui/v8-mirror/202608292126-map-ready-fetch-bridge.js
          node --check ui/v8-mirror/202608292126-pre-snapped-config-adapter.js
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              Path('contracts/202608292126-map-ready-runtime.json'),
              Path('machine-learning/schemas/layer-performance-record-v1.schema.json'),
          ]:
              json.loads(path.read_text())
          PY

          source_paths=(
            atman/202608292126-layer-performance-comparator.mjs
            compiler/202608292126-build-map-ready-v9.py
            contracts/202608292126-map-ready-runtime.json
            machine-learning/schemas/layer-performance-record-v1.schema.json
            ui/v8-mirror/202608292126-map-ready-fetch-bridge.js
            ui/v8-mirror/202608292126-pre-snapped-config-adapter.js
          )
          git add -- "${source_paths[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' "${source_paths[@]}" | sort)
          test "${#staged[@]}" = "${#expected[@]}"
          test "${staged[*]}" = "${expected[*]}"

          git config user.name gridatlas-map-ready-source-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608292206: install map-ready runtime and comparator source'
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
          echo "Installed source commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

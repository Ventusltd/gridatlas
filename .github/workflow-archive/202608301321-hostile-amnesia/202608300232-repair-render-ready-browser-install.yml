name: 202608300232 Repair render-ready browser dependencies
run-name: Repair Chromium and WebKit install at ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/202608300232-repair-render-ready-browser-install.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gridatlas-202608300232-browser-install-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch one CI dependency line and re-trigger governed pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact main source boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 20
          persist-credentials: true

      - name: Require exact current main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Apply bounded WebKit installation repair
        run: |
          set -euo pipefail
          target=.github/workflows/202608292311-build-verify-publish-render-ready-v9.yml
          test -f "$target"
          test "$(grep -Fxc '          npx playwright install --with-deps chromium' "$target")" = 1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/202608292311-build-verify-publish-render-ready-v9.yml')
          before = '          npx playwright install --with-deps chromium\n'
          after = '          npx playwright install --with-deps chromium webkit\n'
          text = path.read_text(encoding='utf-8')
          assert text.count(before) == 1
          path.write_text(text.replace(before, after), encoding='utf-8', newline='\n')
          PY
          test "$(grep -Fxc '          npx playwright install --with-deps chromium webkit' "$target")" = 1
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$target"

      - name: Commit compare-and-swap repair to main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add .github/workflows/202608292311-build-verify-publish-render-ready-v9.yml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" = 1
          test "${staged[0]}" = .github/workflows/202608292311-build-verify-publish-render-ready-v9.yml
          git config user.name gridatlas-ci-repair-bot
          git config user.email actions@users.noreply.github.com
          git commit -m '202608300232: install WebKit for mobile render comparator'
          git push origin HEAD:main

name: "Contribute a photograph"
description: "Submit a public, rights-cleared photo of a grid or renewable-energy asset for possible inclusion in GridAtlas."
title: "[Photograph]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to the open GridAtlas project.

        **Important:** This GitHub issue and its attachments are **public immediately**, even before editorial review. Do not upload confidential material, private-site security details, identifiable people, vehicle registrations, or images containing sensitive location metadata. Remove EXIF metadata before upload.

        Submission does **not** mean that a photograph has been verified or published on the Atlas map. An editor must approve it. Please provide a genuine public asset identifier where possible; we do not identify assets solely by proximity.
  - type: input
    id: site
    attributes:
      label: "Asset or site name"
      description: "Use the name on an official/public source where possible."
      placeholder: "Example: public substation or solar farm name"
    validations:
      required: true
  - type: dropdown
    id: asset-type
    attributes:
      label: "Asset type"
      options:
        - Substation
        - Overhead transmission line / pylon
        - Underground cable works (public view only)
        - Solar photovoltaic farm
        - Battery energy storage
        - Wind farm
        - Transformer or switchgear (public view only)
        - Other electricity infrastructure
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: "Official public identifier (optional)"
      description: "REPD reference, publicly published asset ID, or source URL. Do not guess."
      placeholder: "REPD ref or URL"
    validations:
      required: false
  - type: input
    id: location
    attributes:
      label: "General public location"
      description: "Town/county is enough. Do not provide private access details."
      placeholder: "Town, county, UK"
    validations:
      required: true
  - type: input
    id: coordinates
    attributes:
      label: "Latitude, longitude (optional)"
      description: "Only if publicly documented or accurately known; not required. These coordinates will not prove asset identity."
      placeholder: "51.0000, -0.1000"
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: "Date photograph was taken (if known)"
      placeholder: "YYYY-MM-DD or approximate month/year"
    validations:
      required: false
  - type: upload
    id: photographs
    attributes:
      label: "Upload photograph(s)"
      description: "Original photographs only. JPG, PNG or WebP; up to GitHub's per-file upload limit. These are PUBLIC as soon as the issue is submitted."
    validations:
      required: true
      accept: ".jpg,.jpeg,.png,.webp"
  - type: input
    id: credit
    attributes:
      label: "Public photographer credit"
      description: "The name or pseudonym you want displayed, which can be your GitHub username."
      placeholder: "@username"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context or evidence (optional)"
      description: "Public source links, what the photograph shows, and any uncertainty. Do not submit private engineering details."
    validations:
      required: false
  - type: checkboxes
    id: permission
    attributes:
      label: "Rights, safety and publication"
      options:
        - label: "I am the photographer or rights holder and I license these photographs under CC BY 4.0, allowing public reuse with the photographer credit supplied above."
          required: true
        - label: "The photographs were lawfully taken and may be shared publicly. They do not expose confidential or sensitive access/security details."
          required: true
        - label: "I have checked for and removed sensitive EXIF/location metadata, and excluded identifiable people or personal data without permission."
          required: true
        - label: "I understand that this GitHub issue and the uploaded files become public immediately, while inclusion on the GridAtlas map requires a separate editorial review."
          required: true

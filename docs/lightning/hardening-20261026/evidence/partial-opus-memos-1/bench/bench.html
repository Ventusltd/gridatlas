<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>opus-memos-1 render bench (SYNTHETIC data, not observations)</title>
<link rel="stylesheet" href="/maplibre-gl.css">
<style>html,body,#map{margin:0;height:100%;background:#000}</style>
<script src="/maplibre-gl.js"></script>
</head><body><div id="map"></div>
<script>
// Render bench for think/memos/rendering-performance.md (opus-memos-1). Data are SYNTHETIC, generated by run-bench.mjs.
// Binary shard "LFB1" (proposal): 32-byte header | u32 slot_offsets[145] | u16 x[n] | u16 y[n] | u32 t[n]
//   x,y = position quantised to 1/65535 of the collector box (-11..3 E, 49.5..61.5 N, collect.py:24): <= 20 m steps.
//   t   = time since header t0 in header unit (ms for a day shard, s for a multi-day pack). Sorted by slot then record.
const BOX = [-11, 49.5, 3, 61.5];
window.LT = []; new PerformanceObserver(l => { for (const e of l.getEntries()) LT.push(e.duration); }).observe({ type: 'longtask', buffered: true });
const longTasksSince = (i0) => { const a = LT.slice(i0); return { n: a.length, total_ms: Math.round(a.reduce((s, x) => s + x, 0)), max_ms: Math.round(Math.max(0, ...a)) }; };
const heapMB = () => performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null;
let map;
window.B = {
  async init() {
    const t0 = performance.now();
    map = new maplibregl.Map({ container: 'map', style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#05070c' } }] },
      center: [-4, 55.2], zoom: 4.2, attributionControl: false, fadeDuration: 0 });
    await new Promise(r => map.on('load', r));
    const gl = map.painter.context.gl;
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    return { load_ms: Math.round(performance.now() - t0), webgl2: typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext,
      renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER), dpr: devicePixelRatio, heapMB: heapMB() };
  },
  async decodeBinary(url) {
    const lt = LT.length, t0 = performance.now();
    const buf = await (await fetch(url)).arrayBuffer(); const t1 = performance.now();
    const dv = new DataView(buf);
    if (dv.getUint32(0, true) !== 0x3142464c) throw new Error('not LFB1');            // 'LFB1'
    const n = dv.getUint32(8, true), unit = dv.getUint32(16, true);
    const offs = new Uint32Array(buf, 32, 145), x = new Uint16Array(buf, 32 + 580, n), y = new Uint16Array(buf, 32 + 580 + 2 * n, n);
    const tOff = 32 + 580 + 4 * n, t = new Uint32Array(buf, tOff + (tOff % 4 ? 4 - tOff % 4 : 0), n);
    const t2 = performance.now();
    // validation pass a consumer must do on untrusted bytes: lengths, monotone offsets, sorted time inside the shard
    let ok = offs[144] === n; for (let i = 1; i < 145 && ok; i++) if (offs[i] < offs[i - 1]) ok = false;
    let sorted = true; for (let i = 1; i < n; i++) if (t[i] < t[i - 1]) { sorted = false; break; }
    const t3 = performance.now();
    window.V = { x, y, t, n, offs, unit, bytes: buf.byteLength };
    return { n, bytes: buf.byteLength, fetch_ms: +(t1 - t0).toFixed(1), views_ms: +(t2 - t1).toFixed(2), validate_ms: +(t3 - t2).toFixed(1),
      offsets_ok: ok, time_sorted: sorted, longTasks: longTasksSince(lt), heapMB: heapMB() };
  },
  async decodeLeanJSON(url) {
    const lt = LT.length, t0 = performance.now();
    const txt = await (await fetch(url)).text(); const t1 = performance.now();
    const fc = JSON.parse(txt); const t2 = performance.now();
    const n = fc.features.length, x = new Uint16Array(n), y = new Uint16Array(n), t = new Uint32Array(n);
    for (let i = 0; i < n; i++) { const f = fc.features[i], c = f.geometry.coordinates;
      x[i] = Math.round((c[0] - BOX[0]) / (BOX[2] - BOX[0]) * 65535); y[i] = Math.round((c[1] - BOX[1]) / (BOX[3] - BOX[1]) * 65535); t[i] = f.properties.t; }
    const t3 = performance.now();
    return { n, bytes: txt.length, fetch_text_ms: +(t1 - t0).toFixed(1), json_parse_ms: +(t2 - t1).toFixed(1), to_typed_ms: +(t3 - t2).toFixed(1),
      longTasks: longTasksSince(lt), heapMB: heapMB() };
  },
  addPoints(sizePx) {
    const { x, y, n } = window.V; const lt = LT.length; const T = {};
    return new Promise((resolve) => {
      const layer = { id: 'flashes', type: 'custom', renderingMode: '2d',
        onAdd(m, gl) {
          const t0 = performance.now();
          const vs = `#version 300 es
            in vec2 a_q; uniform mat4 u_m; uniform float u_size; const float PI = 3.141592653589793;
            void main(){ float lon = -11.0 + 14.0 * a_q.x, lat = 49.5 + 12.0 * a_q.y;
              float mx = (lon + 180.0) / 360.0, my = (180.0 - degrees(log(tan(PI / 4.0 + radians(lat) / 2.0)))) / 360.0;
              gl_Position = u_m * vec4(mx, my, 0.0, 1.0); gl_PointSize = u_size; }`;
          const fs = `#version 300 es
            precision mediump float; out vec4 o;
            void main(){ vec2 d = gl_PointCoord - 0.5; if (dot(d, d) > 0.25) discard; o = vec4(1.0, 0.85, 0.35, 1.0) * 0.55; }`;
          const p = gl.createProgram();
          for (const [k, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) { const sh = gl.createShader(k); gl.shaderSource(sh, s); gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); }
          gl.linkProgram(p); this.p = p; this.aq = gl.getAttribLocation(p, 'a_q'); this.um = gl.getUniformLocation(p, 'u_m'); this.us = gl.getUniformLocation(p, 'u_size');
          // interleave x,y into one u16x2 buffer (one copy on the CPU; the shard could be stored interleaved to avoid it)
          const t1 = performance.now(); const xy = new Uint16Array(2 * n); for (let i = 0; i < n; i++) { xy[2 * i] = x[i]; xy[2 * i + 1] = y[i]; }
          const t2 = performance.now(); this.b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.b); gl.bufferData(gl.ARRAY_BUFFER, xy, gl.STATIC_DRAW); gl.finish();
          const t3 = performance.now(); T.compile_ms = +(t1 - t0).toFixed(1); T.interleave_ms = +(t2 - t1).toFixed(1); T.upload_ms = +(t3 - t2).toFixed(1);
          this.first = 0; this.count = n; this.draws = []; T.gpu_bytes = xy.byteLength; this.t0 = t0;
        },
        render(gl, matrix) {
          const a = performance.now();
          gl.useProgram(this.p); gl.bindBuffer(gl.ARRAY_BUFFER, this.b); gl.enableVertexAttribArray(this.aq);
          gl.vertexAttribPointer(this.aq, 2, gl.UNSIGNED_SHORT, true, 0, 0);
          gl.uniformMatrix4fv(this.um, false, new Float32Array(matrix)); gl.uniform1f(this.us, sizePx * devicePixelRatio);
          gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.drawArrays(gl.POINTS, this.first, this.count); gl.finish();
          const d = performance.now() - a; this.draws.push(d);
          if (this.draws.length === 1) { T.layer_first_draw_ms = +d.toFixed(1); T.add_to_first_frame_ms = +(performance.now() - this.t0).toFixed(1);
            T.longTasks = longTasksSince(lt); T.heapMB = heapMB(); resolve(T); }
        } };
      window.PL = layer; map.addLayer(layer); map.triggerRepaint();
    });
  },
  setWindow(t0, t1) {           // window change on time-sorted data = two binary searches + drawArrays(first,count); nothing re-uploaded
    const { t, n } = window.V, a = performance.now(); const lb = (v) => { let lo = 0, hi = n; while (lo < hi) { const m = (lo + hi) >> 1; if (t[m] < v) lo = m + 1; else hi = m; } return lo; };
    const i0 = lb(t0), i1 = lb(t1); PL.first = i0; PL.count = i1 - i0; const s = performance.now() - a; map.triggerRepaint(); return { drawn: i1 - i0, search_ms: +s.toFixed(3) };
  },
  async frames(k, layerName) {   // k camera steps; each waits for the frame; frame interval and layer draw recorded
    const lt = LT.length, L = layerName === 'grid' ? window.GL_ : window.PL; const d0 = L.draws.length; const iv = []; let last = performance.now();
    for (let i = 0; i < k; i++) { map.jumpTo({ center: [-4 + 0.05 * i, 55.2], zoom: 4.2 + 0.01 * i });
      await new Promise(r => map.once('render', r)); const now = performance.now(); iv.push(now - last); last = now; }
    const dr = L.draws.slice(d0).sort((a, b) => a - b), ivs = iv.slice().sort((a, b) => a - b);
    const med = a => a.length ? +a[Math.floor(a.length / 2)].toFixed(1) : null, p90 = a => a.length ? +a[Math.min(a.length - 1, Math.floor(a.length * 0.9))].toFixed(1) : null;
    return { frames: k, interval_median_ms: med(ivs), interval_p90_ms: p90(ivs), layer_draw_median_ms: med(dr), layer_draw_p90_ms: p90(dr), longTasks: longTasksSince(lt) };
  },
  binGrid(cellLon, cellLat) {    // LOD: counts per instrument-scale cell (the data owner can precompute this as a rollup)
    const { x, y, n } = window.V, lt = LT.length, a = performance.now();
    const nx = Math.ceil(14 / cellLon), ny = Math.ceil(12 / cellLat), c = new Uint32Array(nx * ny), sx = 14 / 65535 / cellLon, sy = 12 / 65535 / cellLat;
    for (let i = 0; i < n; i++) { const gx = Math.min(nx - 1, (x[i] * sx) | 0), gy = Math.min(ny - 1, (y[i] * sy) | 0); c[gy * nx + gx]++; }
    const b = performance.now(); let mx = 0; for (let i = 0; i < c.length; i++) if (c[i] > mx) mx = c[i];
    const tex = new Uint8Array(c.length); const lm = Math.log1p(mx); for (let i = 0; i < c.length; i++) tex[i] = c[i] ? Math.max(1, Math.round(255 * Math.log1p(c[i]) / lm)) : 0;
    window.GRID = { nx, ny, tex, cellLon, cellLat }; const e = performance.now();
    return { cells: nx * ny, nx, ny, bin_ms: +(b - a).toFixed(1), to_texture_ms: +(e - b).toFixed(1), raw_u16_bytes: 2 * nx * ny, longTasks: longTasksSince(lt) };
  },
  addGrid() {
    const G = window.GRID, lt = LT.length, T = {};
    return new Promise((resolve) => {
      const layer = { id: 'grid', type: 'custom', renderingMode: '2d',
        onAdd(m, gl) { const t0 = performance.now();
          const vs = `#version 300 es
            in vec2 a_m; uniform mat4 u_m; out vec2 v_m; void main(){ v_m = a_m; gl_Position = u_m * vec4(a_m, 0.0, 1.0); }`;
          const fs = `#version 300 es
            precision highp float; in vec2 v_m; uniform sampler2D u_t; uniform vec2 u_cell; uniform vec2 u_n; out vec4 o; const float PI = 3.141592653589793;
            void main(){ float lon = v_m.x * 360.0 - 180.0; float lat = degrees(2.0 * atan(exp(radians(180.0 - v_m.y * 360.0)))) - 90.0;   // exact inverse Mercator
              vec2 g = floor(vec2((lon + 11.0) / u_cell.x, (lat - 49.5) / u_cell.y)); if (any(lessThan(g, vec2(0.0))) || any(greaterThanEqual(g, u_n))) discard;
              float v = texelFetch(u_t, ivec2(g), 0).r; if (v <= 0.0) discard; o = vec4(1.0, 0.8, 0.3, 1.0) * (0.15 + 0.75 * v); }`;
          const p = gl.createProgram();
          for (const [k, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) { const sh = gl.createShader(k); gl.shaderSource(sh, s); gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); }
          gl.linkProgram(p); this.p = p;
          const mx = l => (l + 180) / 360, my = a => (180 - (180 / Math.PI) * Math.log(Math.tan(Math.PI / 4 + a * Math.PI / 360))) / 360;
          const q = new Float32Array([mx(-11), my(49.5), mx(3), my(49.5), mx(-11), my(61.5), mx(3), my(61.5)]);
          this.b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.b); gl.bufferData(gl.ARRAY_BUFFER, q, gl.STATIC_DRAW);
          this.t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, this.t); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, G.nx, G.ny, 0, gl.RED, gl.UNSIGNED_BYTE, G.tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
          this.am = gl.getAttribLocation(p, 'a_m'); this.um = gl.getUniformLocation(p, 'u_m'); this.draws = []; this.t0 = t0; T.setup_ms = +(performance.now() - t0).toFixed(1); },
        render(gl, matrix) { const a = performance.now();
          gl.useProgram(this.p); gl.bindBuffer(gl.ARRAY_BUFFER, this.b); gl.enableVertexAttribArray(this.am); gl.vertexAttribPointer(this.am, 2, gl.FLOAT, false, 0, 0);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.t); gl.uniform1i(gl.getUniformLocation(this.p, 'u_t'), 0);
          gl.uniform2f(gl.getUniformLocation(this.p, 'u_cell'), G.cellLon, G.cellLat); gl.uniform2f(gl.getUniformLocation(this.p, 'u_n'), G.nx, G.ny);
          gl.uniformMatrix4fv(this.um, false, new Float32Array(matrix)); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.finish(); const d = performance.now() - a; this.draws.push(d);
          if (this.draws.length === 1) { T.first_draw_ms = +d.toFixed(1); T.add_to_first_frame_ms = +(performance.now() - this.t0).toFixed(1); T.longTasks = longTasksSince(lt); resolve(T); } } };
      window.GL_ = layer; map.addLayer(layer); map.triggerRepaint();
    });
  },
  async geojsonCircles(url) {   // anchor to the budget lane: lean GeoJSON, setData(object) + circle layer -> map idle
    const lt = LT.length, t0 = performance.now(); const data = await (await fetch(url)).json(); const t1 = performance.now();
    map.addSource('g', { type: 'geojson', data }); map.addLayer({ id: 'gc', type: 'circle', source: 'g', paint: { 'circle-radius': 2, 'circle-color': '#ffd27a', 'circle-opacity': 0.6 } });
    await new Promise(r => { const chk = () => (map.loaded() && map.areTilesLoaded()) ? r() : setTimeout(chk, 50); setTimeout(chk, 50); });
    const t2 = performance.now(); return { n: data.features.length, fetch_parse_ms: Math.round(t1 - t0), add_to_idle_ms: Math.round(t2 - t1), longTasks: longTasksSince(lt), heapMB: heapMB() };
  }
};
</script></body></html>
